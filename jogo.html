<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Urna Lógica — Jogo</title>
<style>
  :root {
    --parede: #2e1d11; --painel: #3a2516; --papel: #f6ead0; --papel2: #fbf3df; --tinta: #2b1d12; --tinta2: #6b5236;
    --laranja: #d9682b; --laranja2: #a9481a; --petroleo: #1f5f5b; --petroleo2: #164844; --ambar: #ffb347;
    --crt: #15110c; --verde: #2e7d4f; --vermelho: #b5321e; --borda: #cdb98f;
    --titulo: "Futura", "Century Gothic", "Avenir Next", "Trebuchet MS", sans-serif;
    --maquina: "Consolas", "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--parede); color: var(--tinta); font: 18px/1.55 "Segoe UI", system-ui, sans-serif; }
  header.topo { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
                background: #1d120a; color: var(--papel); padding: 10px 18px; border-bottom: 4px solid var(--laranja); }
  header.topo .marca { font-family: var(--titulo); letter-spacing: .1em; text-transform: uppercase; font-size: 14px; font-weight: 700; }
  .selos { display: flex; gap: 8px; margin-left: auto; }
  .selo { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-family: var(--titulo); font-weight: 700;
          background: #4a3a2a; color: #9c8a73; border: 2px solid #6b5236; font-size: 15px; }
  .selo.ok { background: radial-gradient(circle at 35% 35%, #f19a5c, var(--laranja2)); color: #fff6e4; border-color: var(--ambar); box-shadow: 0 0 10px rgba(255,179,71,.5); }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
  .folha { background: var(--papel); border-radius: 8px; padding: 22px 26px; box-shadow: 0 8px 0 #1d120a; margin-bottom: 18px; }
  h1, h2, h3 { font-family: var(--titulo); margin: 0 0 10px; }
  h1 { font-size: 28px; } h2 { font-size: 22px; } h3 { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--tinta2); }
  p { margin: 0 0 10px; }
  .agora { background: #fff3d6; border: 3px solid var(--laranja); border-radius: 10px; padding: 12px 16px; margin: 12px 0; font-size: 18px; }
  .agora b { font-family: var(--titulo); letter-spacing: .06em; color: var(--laranja2); display: block; font-size: 13px; text-transform: uppercase; }
  .msg { border-radius: 8px; padding: 12px 16px; margin: 12px 0; font-size: 18px; white-space: pre-line; border: 2px solid var(--tinta2); background: var(--papel2); min-height: 50px; }
  .msg.ok { border-color: var(--verde); background: #e3f1e5; } .msg.nao { border-color: var(--vermelho); background: #f8e1da; }
  .msg:empty { display: none; }
  .msg.dica { border-color: var(--petroleo); background: #e0eeec; }
  .msg.vitoria { border-color: var(--ambar); background: #fff1cf; font-size: 20px; font-weight: 600; }
  button { font: inherit; cursor: pointer; }
  .btn { font-family: var(--titulo); font-size: 17px; font-weight: 700; letter-spacing: .03em;
         background: var(--laranja); color: #fff8ec; border: 0; border-bottom: 5px solid var(--laranja2);
         border-radius: 10px; padding: 12px 18px; margin: 4px 6px 4px 0; min-height: 50px; }
  .btn:hover { filter: brightness(1.07); } .btn:active { transform: translateY(2px); border-bottom-width: 3px; }
  .btn.sec { background: var(--petroleo); border-bottom-color: var(--petroleo2); }
  .btn.neutro { background: #e6d6b2; color: var(--tinta); border-bottom-color: #b9a37a; }
  .btn.grande { font-size: 20px; padding: 16px 22px; min-width: 220px; }
  .btn:disabled { opacity: .4; cursor: default; }
  .grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
  .cartao { background: var(--papel2); border: 2px solid var(--borda); border-radius: 10px; padding: 14px; }
  .cartao .btn { width: 100%; margin-top: 8px; }
  .dois { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; }
  @media (max-width: 820px) { .dois { grid-template-columns: 1fr; } .folha { padding: 18px 16px; } }
  .caixa { background: var(--papel2); border: 2px dashed var(--borda); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
  .ficha { display: inline-block; font-family: var(--maquina); background: #fff; border: 2px solid var(--tinta2); border-radius: 6px;
           padding: 6px 12px; margin: 3px; font-size: 17px; font-weight: 700; }
  .ficha.destaque { background: var(--ambar); border-color: var(--laranja2); }
  .vazia { color: var(--tinta2); font-style: italic; }
  table.reg { border-collapse: collapse; width: 100%; font-family: var(--maquina); font-size: 15px; }
  table.reg th { text-align: left; font-family: var(--titulo); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--tinta2);
                 border-bottom: 2px solid var(--tinta2); padding: 6px; }
  table.reg td { padding: 5px 6px; border-bottom: 1px dotted var(--borda); }
  table.reg tr.erro td { background: #f6c5b8; }
  .escolha { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 12px; }
  .escolha button { font-family: var(--titulo); font-weight: 700; font-size: 16px; border-radius: 8px; padding: 10px 14px;
                    border: 2px solid var(--tinta2); background: #fff8ec; color: var(--tinta); }
  .escolha button.sel { background: var(--petroleo); color: #fff; border-color: var(--petroleo2); }
  .crt { background: var(--crt); border: 8px solid #5b4632; border-radius: 12px; padding: 8px; }
  .crt svg text { fill: var(--ambar); font-family: var(--maquina); }
  .legenda { font-size: 15px; color: var(--tinta2); }
  details { margin: 10px 0; } summary { cursor: pointer; font-family: var(--titulo); font-weight: 700; color: var(--petroleo); }
  .doc { font-family: var(--maquina); background: var(--papel2); border-left: 5px solid var(--laranja); padding: 10px 14px; white-space: pre-line; font-size: 15px; }
  .barra { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 10px; padding-top: 10px; border-top: 2px dotted var(--borda); }
  .codigo { font-family: var(--maquina); font-size: 14px; background: #efe3c4; border-radius: 4px; padding: 1px 6px; }
  table.metr { border-collapse: collapse; width: 100%; font-size: 15px; }
  table.metr th, table.metr td { border-bottom: 1px dotted var(--borda); padding: 6px; text-align: right; }
  table.metr th:first-child, table.metr td:first-child, table.metr th:nth-child(2), table.metr td:nth-child(2) { text-align: left; }
  /* ---------- abertura, tutorial, carimbo, estrelas ---------- */
  .capa { text-align: center; padding: 34px 26px; }
  .capa h1 { font-size: 34px; } .capa .linhas { font-size: 21px; line-height: 1.7; margin: 18px auto 24px; max-width: 640px; }
  .capa .linhas div::before { content: "▸ "; color: var(--laranja); }
  .veu { position: fixed; inset: 0; background: rgba(21,17,12,.72); z-index: 20; display: grid; place-items: center; padding: 16px; animation: aparece .2s; }
  .tut { background: var(--papel); border: 4px solid var(--laranja); border-radius: 14px; max-width: 600px; width: 100%; max-height: 88vh; overflow-y: auto; padding: 22px 24px; box-shadow: 0 10px 0 #1d120a; }
  .tut h2 { margin-bottom: 4px; } .tut .rotulo { font-family: var(--titulo); color: var(--laranja2); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
  .tut ol { font-size: 19px; padding-left: 26px; } .tut li { margin: 8px 0; } .tut .icone { font-size: 46px; float: right; margin-left: 12px; }
  .carimbo { width: 250px; height: 250px; border-radius: 50%; border: 10px double #fff1cf; background: radial-gradient(circle at 35% 30%, #f19a5c, var(--laranja2));
             color: #fff6e4; display: grid; place-items: center; text-align: center; font-family: var(--titulo); font-weight: 800;
             box-shadow: 0 0 40px rgba(255,179,71,.7); animation: carimba .55s cubic-bezier(.2,1.6,.4,1) both; cursor: pointer; }
  .carimbo .grande { font-size: 30px; letter-spacing: .06em; } .carimbo .est { font-size: 34px; letter-spacing: 4px; color: #ffe08a; }
  @keyframes carimba { 0% { transform: scale(3) rotate(-30deg); opacity: 0; } 60% { opacity: 1; } 100% { transform: scale(1) rotate(-12deg); } }
  @keyframes aparece { from { opacity: 0; } }
  .est-cartao { color: #e0a21b; font-size: 20px; letter-spacing: 2px; } .est-cartao .vazia-est { color: #cdb98f; }
  .som { margin-left: 8px; background: none; border: 2px solid #6b5236; color: var(--papel); border-radius: 8px; padding: 4px 10px; font-size: 14px; }
  /* ---------- Fase 1: chave e lote animado ---------- */
  .pecas button { font-size: 18px; padding: 12px 18px; }
  .pecas button:disabled { opacity: .35; }
  .slot { display: inline-flex; align-items: center; justify-content: center; min-width: 120px; height: 52px; border: 3px dashed var(--borda); border-radius: 10px;
          margin: 4px; font-family: var(--titulo); font-weight: 700; font-size: 17px; color: var(--tinta2); background: #fffaf0; }
  .slot.cheio { border-style: solid; border-color: var(--petroleo); background: var(--petroleo); color: #fff; cursor: pointer; }
  .slot .n { font-size: 12px; opacity: .7; margin-right: 6px; }
  .lote { position: relative; font-family: var(--maquina); font-size: 15px; }
  .lote .linha { position: absolute; left: 0; right: 0; height: 32px; display: grid; grid-template-columns: 40px 1.2fr 1fr 1fr 1fr 1.4fr 1.6fr;
                 align-items: center; padding: 0 6px; border-bottom: 1px dotted var(--borda); transition: top .22s ease, background .3s; background: var(--papel); }
  .lote .linha.mexeu { background: #ffe0a8; } .lote .linha.erro { background: #f6c5b8; }
  .lote .cab { position: static; font-family: var(--titulo); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--tinta2); border-bottom: 2px solid var(--tinta2); }
  .placar { scroll-margin-top: 84px; font-family: var(--maquina); font-size: 18px; background: var(--crt); color: var(--ambar); border-radius: 8px; padding: 8px 14px; display: inline-block; margin: 6px 0; }
  .ficha { transition: transform .35s ease; }
  /* ---------- modo aluno: narradora, termos, para decidir ---------- */
  .pearl { display: flex; gap: 12px; align-items: flex-start; background: #1f3d3b; color: #f3ead6; border-radius: 12px; padding: 12px 16px; margin: 10px 0; font-size: 17px; }
  .pearl .av { font-size: 40px; line-height: 1; } .pearl .quem { display: block; color: var(--ambar); font-family: var(--titulo); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; }
  .termo { display: inline-block; font: 600 15px var(--titulo); background: #e0eeec; color: var(--petroleo2); border: 2px solid var(--petroleo); border-radius: 999px;
           padding: 1px 10px; margin: 2px 3px; cursor: pointer; white-space: nowrap; vertical-align: middle; }
  .termo:hover { background: var(--petroleo); color: #fff; }
  .portras { background: #f1e7cf; border: 2px dashed var(--petroleo); border-radius: 10px; padding: 8px 12px; margin: 10px 0; font-size: 15px; }
  .portras > b { font-family: var(--titulo); color: var(--petroleo2); margin-right: 6px; }
  .decidir { background: #eef6f4; border-left: 6px solid var(--petroleo); border-radius: 8px; padding: 10px 14px; margin: 10px 0; font-size: 16px; }
  .decidir .rot { font-family: var(--titulo); color: var(--petroleo2); display: block; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 4px; }
  .metodos { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; margin: 8px 0 12px; }
  .metodo { text-align: left; background: #fff8ec; border: 3px solid var(--borda); border-radius: 12px; padding: 12px 14px; font: inherit; color: var(--tinta); cursor: pointer; }
  .metodo .tit { font: 800 18px var(--titulo); display: block; margin-bottom: 4px; } .metodo .legenda { display: block; margin-top: 6px; }
  .metodo.sel { border-color: var(--petroleo); background: #dff0ed; box-shadow: 0 0 0 3px var(--petroleo) inset; }
  .metodo:disabled { opacity: .5; cursor: default; }
  .camada { font-size: 13px; color: var(--tinta2); font-weight: 400; text-transform: none; letter-spacing: 0; }
  .missoes { list-style: none; padding: 0; margin: 6px 0; font-size: 18px; } .missoes li { margin: 4px 0; } .missoes li.ok { color: var(--verde); text-decoration: line-through; }
  .abas { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; } .abas button { font: 700 16px var(--titulo); border: 2px solid var(--tinta2); border-radius: 8px 8px 0 0; padding: 8px 16px; background: #efe3c4; color: var(--tinta); }
  .abas button.sel { background: var(--petroleo); color: #fff; border-color: var(--petroleo2); } .abas button:disabled { opacity: .45; }
  .gloss h3 { margin-top: 12px; } .gloss .camada-t { font: 700 12px var(--titulo); letter-spacing: .06em; text-transform: uppercase; color: var(--laranja2); margin-top: 8px; display: block; }
  /* ---------- perfis: cada um com cor e ícone ---------- */
  :root { --c-estudante: #d9682b; --c-colega: #1f5f5b; --c-professora: #a8741a; }
  .perfil { border-left: 8px solid var(--cor); background: color-mix(in srgb, var(--cor) 9%, #fffaf0); border-radius: 10px; padding: 12px 16px; margin: 12px 0; font-size: 18px; }
  .perfil > .cab { font: 800 15px var(--titulo); letter-spacing: .05em; text-transform: uppercase; color: var(--cor); display: block; margin-bottom: 4px; }
  .perfil ol, .perfil ul { margin: 4px 0 4px 0; padding-left: 24px; } .perfil li { margin: 3px 0; }
  details.perfil > summary { font: 800 15px var(--titulo); letter-spacing: .05em; text-transform: uppercase; color: var(--cor); }
  .cartoes-perfil { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; margin: 18px auto; max-width: 900px; }
  .cartao-perfil { text-align: left; border: 3px solid var(--cor); border-radius: 14px; background: color-mix(in srgb, var(--cor) 8%, #fffaf0); padding: 16px; font: inherit; color: var(--tinta); cursor: pointer; }
  .cartao-perfil:hover { box-shadow: 0 0 0 4px color-mix(in srgb, var(--cor) 35%, transparent); }
  .cartao-perfil .ic { font-size: 42px; } .cartao-perfil b { display: block; font: 800 20px var(--titulo); color: var(--cor); margin: 4px 0; }
  .som.perfil-btn { border-color: var(--cor, #6b5236); }
  details.tip { display: inline-block; vertical-align: top; margin: 2px 0; }
  details.tip > summary { display: inline-block; cursor: pointer; font: 700 15px var(--titulo); color: var(--petroleo2); border: 2px dashed var(--petroleo); border-radius: 999px; padding: 2px 12px; list-style: none; }
  details.tip > summary::-webkit-details-marker { display: none; }
  details.tip[open] { display: block; } details.tip > div { background: #eef6f4; border-left: 5px solid var(--petroleo); border-radius: 8px; padding: 10px 14px; margin-top: 6px; font-size: 17px; }
  /* ---------- ver o código ---------- */
  pre.cod { background: #15110c; color: #f3ead6; font: 13px/1.45 var(--maquina); padding: 12px 14px; border-radius: 8px; overflow: auto; max-height: 52vh; white-space: pre; margin: 6px 0 14px; }
  .tut.larga { max-width: 980px; }
  /* ---------- Fase 5: suspense ---------- */
  .chk { opacity: .25; transition: opacity .3s; } .chk.on { opacity: 1; }
  .cofre { font-size: 90px; text-align: center; animation: gira 1.2s ease both; }
  @keyframes gira { 0% { transform: rotate(0) scale(.6); } 70% { transform: rotate(360deg) scale(1.15); } 100% { transform: rotate(360deg) scale(1); } }
</style>
</head>
<body>
<header class="topo">
  <span class="marca">Urna Lógica · Verídia 2042</span>
  <button class="btn neutro" style="min-height:36px;padding:6px 12px;font-size:14px" onclick="ir('menu')">Menu</button>
  <div class="selos" id="selos" title="Selos conquistados"></div>
  <button class="som perfil-btn" id="perfil-btn" onclick="escolherPerfil()" title="Trocar o perfil de quem joga">👤 Perfil</button>
  <button class="som" onclick="abrirDicionario()" title="O que significa cada palavra do jogo">📖 Dicionário</button>
  <button class="som" id="som" onclick="P.som=!P.som;salvar();marcarSom()" title="Som do carimbo">🔇 som</button>
</header>
<main id="tela"></main>

<script>
const D = {"titulo": "Urna Lógica — O Enigma da Eleição de Verídia", "prologo": ["É o ano de 2042. A cidade de Verídia acaba de realizar sua eleição municipal.", "Ao final da apuração, uma falha de sincronização atingiu o sistema de auditoria. Nenhum registro foi necessariamente alterado — mas os dados ficaram fora de ordem, conexões entre os locais de votação foram interrompidas e parte da trilha de processamento não pode mais ser consultada diretamente.", "A Comissão Independente de Verificação (CIV), uma entidade apartidária, convoca você: Analista de Integridade de Dados.", "A pergunta da CIV é simples: é possível reconstruir uma trilha coerente entre os registros de origem, os locais de votação e o relatório final, respeitando todas as regras?", "Sua missão é recuperar os cinco selos de auditoria e chegar ao Cofre de Verificação. O objetivo não é favorecer candidato algum: é verificar, com regras explícitas e dados claros, se a apuração simulada pode ser reconstruída."], "aviso": "Verídia, seus locais, registros, códigos e candidatos são inteiramente fictícios. Finalidade acadêmica: exercitar lógica, estruturas de dados e algoritmos.", "capitulos": [{"selo": 1, "fase": "Fase 1 — O Arquivo Embaralhado", "abertura": "Alerta: o arquivo de registros chegou fora de ordem.\nA sequência original foi perdida.\nAntes de investigar, precisamos organizar os dados sem perder nenhum registro.", "missao": "Organizar o lote de registros na ordem exigida pela auditoria, sem perder nenhum.", "ferramentas": "vetor de registros, seed, Bubble, Merge e Quick Sort, chave composta"}, {"selo": 2, "fase": "Fase 2 — A Central de Triagem", "abertura": "Os registros foram organizados.\nAgora precisamos movimentar as evidências sem quebrar a sequência de processamento.\nAtenção: algumas ações podem ser desfeitas; outras obedecem à ordem de chegada.", "missao": "Montar a sequência de custódia E2 → E4 → E1 → E6 a partir da fila de chegada.", "ferramentas": "fila (FIFO), pilha (LIFO) e desfazer, lista ligada"}, {"selo": 3, "fase": "Fase 3 — O Mapa das Seções", "abertura": "As evidências estão organizadas, mas a trilha entre os locais foi fragmentada.\nHá caminhos alternativos, conexões interrompidas e passagens que dependem\nde pistas já coletadas. Reconstrua a rota sem se perder no mapa.", "missao": "Ir da Central de Auditoria ao Centro de Validação passando pela autenticação.", "ferramentas": "grafo, lista de adjacência, estado, BFS e DFS, árvore de busca"}, {"selo": 4, "fase": "Fase 4 — O Cofre dos Estados", "abertura": "O sistema está explorando caminhos repetidos.\nPara não investigar a mesma configuração indefinidamente, precisamos\nreconhecer estados já visitados. O cofre só abre quando a memória do\nsistema estiver organizada.", "missao": "Organizar a memória do sistema para não investigar o mesmo estado duas vezes.", "ferramentas": "árvore AVL, rotações, chave de estado"}, {"selo": 5, "fase": "Fase 5 — A Auditoria Final", "abertura": "Todos os selos foram recuperados (ou quase!).\nAgora é preciso reconstruir a trilha completa, conferir as evidências e\ndemonstrar que o resultado decorre das regras, e não de uma resposta pré-programada.", "missao": "Reconstruir a trilha completa e provar que ela decorre das regras.", "ferramentas": "integração, solver, métricas, ordenação do relatório"}], "fase1": {"nome": "Fase 1 — O Arquivo Embaralhado", "abertura": "Alerta: o arquivo de registros chegou fora de ordem.\nA sequência original foi perdida.\nAntes de investigar, precisamos organizar os dados sem perder nenhum registro.", "enigma": "A auditoria só aceita o lote ordenado por ZONA, depois por SEÇÃO e,\nem caso de empate, por HORÁRIO. Atenção: há registros com o mesmo\nhorário em zonas diferentes. Qual critério garante a ordem pedida?", "registros": [["VR-0012", "03", "001", "15", "18:42:10", "PENDENTE"], ["VR-0001", "03", "002", "24", "18:56:00", "DIVERGENTE"], ["VR-0005", "02", "003", "33", "18:56:00", "CONFERIDO"], ["VR-0003", "02", "003", "40", "1 ull]]}, {"extraiu": "I", "d": 3, "melhorou": [], "heap": [["G", 4], ["F", null], ["D", 5]]}, {"extraiu": "G", "d": 4, "melhorou": [["F", null, 9]], "heap": [["D", 5], ["F", 9]]}, {"extraiu": "D", "d": 5, "melhorou": [["F", 9, 7]], "heap": [["F", 7]]}, {"extraiu": "F", "d": 7, "melhorou": [], "heap": []}]}}, "codigo": {"f1": [{"titulo": "Chave composta (enunciado, Fase 1)", "nome": "chave_composta", "arquivo": "jogo/registros.py", "linha": 76, "codigo": "def chave_composta(campos):\n    \"\"\"\n    Chave = tupla com os campos na ordem escolhida. O identificador entra no fim\n    como desempate (se ainda não estiver), como nos critérios fixos.\n    \"\"\"\n    campos = list(campos)\n    if not campos or any(c not in CAMPOS for c in campos) or len(set(campos)) != len(campos):\n        raise ValueError(f\"Chave inválida: {campos}\")\n    usados = campos + ([] if \"id\" in campos else [\"id\"])\n    return lambda r: tuple(CAMPOS[c](r) for c in usados)"}, {"titulo": "Bubble Sort — aula 02, slide 10", "nome": "bubble_sort", "arquivo": "algoritmos/ordenacao.py", "linha": 51, "codigo": "def bubble_sort(A, chave=_identidade):\n    \"\"\"\n    bubbleSort (A[0..n-1], n)                          [Aula 02, slide 10]\n    1. para (j = n-1; j >= 1; j--) faça\n    2.     para (i = 0; i <= j-1; i++) faça\n    3.         se (A[i] > A[i+1]) então\n    4.             aux <- A[i]\n    5.             A[i] <- A[i+1]\n    6.             A[i+1] <- aux\n\n    Ideia: a cada passada j, o maior elemento ainda fora do lugar\n    \"borbulha\" até a posição j. Depois da passada j, A[j..n-1] está pronto.\n    Comparações: (n-1) + (n-2) + ... + 1 = n(n-1)/2 = Θ(n²), sempre.\n    \"\"\"\n    c = Contador(\"Bubble Sort\")\n    inicio = time.perf_counter()\n    n = len(A)\n    for j in range(n - 1, 0, -1):                  # 1: j = n-1 ... 1\n        for i in range(0, j):                      # 2: i = 0 ... j-1\n            c.comparacoes += 1\n            if chave(A[i]) > chave(A[i + 1]):      # 3\n                aux = A[i]                         # 4\n                A[i] = A[i + 1]                    # 5\n                A[i + 1] = aux                     # 6\n                c.movimentacoes += 3\n    c.tempo_ms = (time.perf_counter() - inicio) * 1000\n    return c"}, {"titulo": "Merge Sort — aula 02, slides 20–22", "nome": "merge_sort", "arquivo": "algoritmos/ordenacao.py", "linha": 108, "codigo": "def merge_sort(A, chave=_identidade):\n    \"\"\"\n    mergeSort (A[p..r], p, r)                          [Aula 02, slide 20]\n    1. se (p < r) então\n    2.     q <- piso((p+r)/2)\n    3.     mergeSort (A[p..q], p, q)\n    4.     mergeSort (A[q+1..r], q+1, r)\n    5.     merge (A[p..r], p, q, r)\n\n    Divisão e conquista: divide ao meio, ordena cada metade, intercala.\n    Recorrência: T(n) = 2T(n/2) + Θ(n)  =>  T(n) = Θ(n log n)   [Aula 04]\n    \"\"\"\n    c = Contador(\"Merge Sort\")\n    inicio = time.perf_counter()\n    B = [None] * len(A)                            # vetor auxiliar B[p..r]\n\n    def merge(p, q, r):\n        \"\"\"\n        merge (A[p..r], p, q, r)                       [Aula 02, slide 21]\n        1. para (i = p; i <= q; i++) faça  B[i] <- A[i]\n        3. para (j = q+1; j <= r; j++) faça  B[q+1+r-j] <- A[j]   // invertida\n        5. i <- p\n        6. j <- r\n        7. para (k = p; k <= r; k++) faça\n        8.     se (B[i] <= B[j]) então A[k] <- B[i]; i <- i+1\n        11.    senão A[k] <- B[j]; j <- j-1\n        \"\"\"\n        for i in range(p, q + 1):                  # 1-2\n            B[i] = A[i]\n            c.movimentacoes += 1\n        for j in range(q + 1, r + 1):              # 3-4\n            B[q + 1 + r - j] = A[j]\n            c.movimentacoes += 1\n        i, j = p, r                                # 5-6\n        for k in range(p, r + 1):                  # 7\n            c.comparacoes += 1\n            if chave(B[i]) <= chave(B[j]):         # 8\n                A[k] = B[i]                        # 9\n                i += 1                             # 10\n            else:                                  # 11\n                A[k] = B[j]                        # 12\n                j -= 1                             # 13\n            c.movimentacoes += 1\n\n    def ordena(p, r):\n        if p < r:                                  # 1 (caso-base: p >= r, 0 ou 1 elemento)\n            q = (p + r) // 2                       # 2\n            ordena(p, q)                           # 3\n            ordena(q + 1, r)                       # 4\n            merge(p, q, r)                         # 5\n\n    ordena(0, len(A) - 1)\n    c.tempo_ms = (time.perf_counter() - inicio) * 1000\n    return c"}, {"titulo": "Quick Sort — aula 04, slides 31–37", "nome": "quick_sort", "arquivo": "algoritmos/ordenacao.py", "linha": 165, "codigo": "def quick_sort(A, chave=_identidade):\n    \"\"\"\n    quickSort (A[p..r], p, r)                          [Aula 04, slide 31]\n    1. se (p < r) então\n    2.     q <- particiona(A[p..r], p, r)\n    3.     quickSort (A[p..q-1], p, q-1)     <-- ver observação\n    4.     quickSort (A[q+1..r], q+1, r)\n\n    Observação: o slide escreve 'quickSort(A[p..q], p, q)'. Com este\n    particiona (pivô no fim), o pivô já está na posição final q; se ele for\n    o maior valor, q = r e 'quickSort(p, q)' repetiria a mesma chamada para\n    sempre. Por isso usamos p..q-1, como no livro de Cormen.\n    (Ver quick_sort_versao_do_slide e o teste que demonstra o problema.)\n\n    Pior caso (vetor já ordenado ou invertido): T(n) = T(n-1) + Θ(n) = Θ(n²)\n    Melhor caso / caso médio: Θ(n log n)                         [Aula 04]\n    \"\"\"\n    c = Contador(\"Quick Sort\")\n    inicio = time.perf_counter()\n\n    def ordena(p, r):\n        if p < r:                                  # 1 (caso-base: p >= r)\n            q = _particiona(A, p, r, chave, c)     # 2\n            ordena(p, q - 1)                       # 3\n            ordena(q + 1, r)                       # 4\n\n    _garantir_pilha_de_recursao(len(A))\n    ordena(0, len(A) - 1)\n    c.tempo_ms = (time.perf_counter() - inicio) * 1000\n    return c"}, {"titulo": "Partição de Lomuto — aula 04", "nome": "_particiona", "arquivo": "algoritmos/ordenacao.py", "linha": 197, "codigo": "def _particiona(A, p, r, chave, c):\n    \"\"\"\n    particiona (A[p..r], p, r)                         [Aula 04, slide 32]\n    1. x <- A[r]                // pivô = último elemento\n    2. i <- p-1\n    3. para (j = p; j <= r-1; j++) faça\n    4.     se (A[j] <= x) então\n    5.         i <- i+1\n    6.         troca A[i] e A[j]\n    7. troca A[i+1] e A[r]\n    8. retorne i+1\n    Ao final: A[p..q-1] <= pivô < A[q+1..r], e o pivô está em q.   Θ(n)\n    \"\"\"\n    x = chave(A[r])                                # 1\n    i = p - 1                                      # 2\n    for j in range(p, r):                          # 3: j = p ... r-1\n        c.comparacoes += 1\n        if chave(A[j]) <= x:                       # 4\n            i += 1                                 # 5\n            A[i], A[j] = A[j], A[i]                # 6\n            c.movimentacoes += 3\n    A[i + 1], A[r] = A[r], A[i + 1]                # 7\n    c.movimentacoes += 3\n    return i + 1                                   # 8"}], "f2": [{"titulo": "Fila: remover do início — aula 06", "nome": "Fila.dequeue", "arquivo": "estruturas/fila.py", "linha": 55, "codigo": "    def dequeue(self):\n        \"\"\"\n        dequeue (fila, i)                              [Aula 06, slide 59]\n        1. se (fila.inicio = NULL) então //fila vazia\n        2.     retorna false\n        3. i <- fila.inicio.chave\n        4. fila.inicio <- fila.inicio.prox\n        5. se (fila.inicio = NULL) então //fila ficou vazia\n        6.     fila.final <- NULL\n        7. retorna true\n        Em Python devolvemos o par (sucesso, valor): (True, i) ou (False, None).\n        \"\"\"\n        if self.inicio is None:              # 1\n            return False, None               # 2\n        i = self.inicio.chave                # 3\n        self.inicio = self.inicio.prox       # 4\n        if self.inicio is None:              # 5\n            self.final = None                # 6\n        self.tamanho -= 1\n        return True, i                       # 7"}, {"titulo": "Pilha: empilhar — aula 06", "nome": "Pilha.push", "arquivo": "estruturas/pilha.py", "linha": 32, "codigo": "    def push(self, chave):\n        \"\"\"\n        push (pilha, x)                                [Aula 06, slide 30]\n        1. x.prox <- pilha.topo\n        2. pilha.topo <- x\n        \"\"\"\n        x = No(chave)\n        x.prox = self.topo      # 1: o novo nó aponta para o antigo topo\n        self.topo = x           # 2: o novo nó passa a ser o topo\n        self.tamanho += 1\n        self.maior_tamanho = max(self.maior_tamanho, self.tamanho)"}, {"titulo": "Pilha: desempilhar — aula 06", "nome": "Pilha.pop", "arquivo": "estruturas/pilha.py", "linha": 44, "codigo": "    def pop(self):\n        \"\"\"\n        pop (pilha, t)                                 [Aula 06, slide 31]\n        1. se (pilha.topo = NULL) então //pilha vazia\n        2.     retorna false\n        3. t <- pilha.topo.chave\n        4. pilha.topo <- pilha.topo.prox\n        5. retorna true\n        Em Python devolvemos o par (sucesso, valor): (True, t) ou (False, None).\n        \"\"\"\n        if self.topo is None:           # 1\n            return False, None          # 2: pilha vazia, nada é alterado\n        t = self.topo.chave             # 3\n        self.topo = self.topo.prox      # 4\n        self.tamanho -= 1\n        return True, t                  # 5"}, {"titulo": "Lista ligada: inserir no fim — aula 06", "nome": "ListaLigada.inserir_fim", "arquivo": "estruturas/lista_ligada.py", "linha": 96, "codigo": "    def inserir_fim(self, chave):\n        \"\"\"Insere após o último nó. O(1) graças ao ponteiro 'ultimo'.\"\"\"\n        x = No(chave)\n        if self.ultimo is None:     # lista vazia: o \"anterior\" é a cabeça\n            self.cabeca.prox = x\n        else:\n            self.ultimo.prox = x\n        self.ultimo = x\n        self.tamanho += 1"}, {"titulo": "Regra do botão “Guardar na pilha”", "nome": "regra_guardar", "arquivo": "jogo/fase2.py", "linha": 72, "codigo": "def regra_guardar(pilha, alvo, evidencia):\n    \"\"\"R2 — evidência sai da fila para o topo da pilha de espera.\"\"\"\n    if evidencia not in alvo:\n        return False, f\"{evidencia} não faz parte da custódia; não precisa esperar na pilha.\"\n    ok, topo = pilha.peek()\n    if ok and alvo.index(evidencia) > alvo.index(topo):\n        return False, (f\"{evidencia} ficaria sobre {topo}, mas {topo} precisa sair antes. \"\n                       f\"Na pilha, só sai quem está no topo (LIFO).\")\n    return True, \"\""}, {"titulo": "Regra do botão “Pôr no cofre”", "nome": "regra_aceitar", "arquivo": "jogo/fase2.py", "linha": 62, "codigo": "def regra_aceitar(custodia, alvo, evidencia):\n    \"\"\"R1 — evidência sai da fila direto para a custódia.\"\"\"\n    esperado = proximo_esperado(custodia, alvo)\n    if evidencia == esperado:\n        return True, \"\"\n    if evidencia not in alvo:\n        return False, f\"{evidencia} não faz parte da custódia; arquive-a.\"\n    return False, f\"A custódia espera {esperado} agora, não {evidencia}.\""}], "f3": [{"titulo": "Grafo por lista de adjacência — aula 09", "nome": "Grafo.adicionar_aresta", "arquivo": "estruturas/grafo.py", "linha": 43, "codigo": "    def adicionar_aresta(self, u, v, peso=None):\n        \"\"\"\n        Insere a aresta (u, v). Vizinhos repetidos são ignorados, para que\n        a mesma conexão não apareça duas vezes na lista (caso de teste do EP).\n        Mantém cada lista em ordem alfabética: assim a ordem de visita da\n        BFS/DFS é sempre a mesma (reprodutível) e fácil de conferir à mão.\n        \"\"\"\n        self.adicionar_vertice(u)\n        self.adicionar_vertice(v)\n        self._inserir_ordenado(u, v)\n        if not self.orientado:\n            self._inserir_ordenado(v, u)\n        if peso is not None:\n            if peso < 0:\n                raise ValueError(\"Dijkstra exige pesos não negativos (aula 11)\")\n            self.pesos[(u, v)] = peso\n            if not self.orientado:\n                self.pesos[(v, u)] = peso"}, {"titulo": "Regras do mapa: vizinho, energia, porta, pista", "nome": "mover", "arquivo": "jogo/fase3.py", "linha": 106, "codigo": "def mover(G, estado, v, portas=PORTAS, pistas_mapa=PISTAS):\n    \"\"\"\n    Aplica as regras R1-R5. Devolve (ok, novo_estado_ou_None, mensagem).\n    É usada TANTO pelo jogador QUANTO pelo solver.\n    \"\"\"\n    pos, pistas, abertas, energia = estado\n    ok, motivo = regra_adjacencia(G, pos, v)\n    if not ok:\n        return False, None, motivo\n    custo = G.peso(pos, v)                     # 1 no mapa padrão; w(u, v) no mapa com custos\n    for ok, motivo in (regra_energia(energia, custo), regra_porta(v, pistas, portas)):\n        if not ok:\n            return False, None, motivo\n    novas_pistas, novas_portas = set(pistas), set(abertas)\n    msg = f\"Você foi de {pos} ({G.nomes[pos]}) para {v} ({G.nomes[v]}).\"\n    if v in portas:\n        if v not in novas_portas:\n            msg += f\" Porta de {v} liberada.\"\n        novas_portas.add(v)\n    if v in pistas_mapa and pistas_mapa[v] not in novas_pistas:\n        novas_pistas.add(pistas_mapa[v])\n        msg += f\" Pista coletada: {NOMES_PISTAS[pistas_mapa[v]]} ({pistas_mapa[v]}).\"\n    if custo != 1:\n        msg += f\" Gastou {custo} de energia.\"\n    novo = (v, tuple(sorted(novas_pistas)), tuple(sorted(novas_portas)), energia - custo)\n    return True, novo, msg"}, {"titulo": "BFS da aula 09 — slides 71–73", "nome": "bfs", "arquivo": "algoritmos/busca_grafo.py", "linha": 22, "codigo": "def bfs(G, s):\n    \"\"\"\n    BFS (G, s)                                         [Aula 09, slides 71-72]\n    1. cor[s] <- CINZA; d[s] <- 0; π[s] <- NULL\n    4. para cada u em V[G]-{s}: cor[u] <- BRANCO; d[u] <- ∞; π[u] <- NULL\n    8. Q <- ∅\n    9. enqueue(Q, s)\n    10. enquanto Q != ∅ faça\n    11.    u <- dequeue(Q)\n    12.    para cada v em Adj[u]\n    13.        se cor[v] = BRANCO então\n    14.            cor[v] <- CINZA\n    15.            d[v] <- d[u] + 1\n    16.            π[v] <- u\n    17.            enqueue(Q, v)\n    18.    cor[u] <- PRETO\n    Complexidade: O(|V| + |E|).\n    Devolve (d, pi, ordem_de_visita, maior_tamanho_da_fila).\n    \"\"\"\n    cor, d, pi = {}, {}, {}\n    for u in G.vertices():                          # 4-7\n        cor[u], d[u], pi[u] = BRANCO, INFINITO, None\n    cor[s], d[s], pi[s] = CINZA, 0, None            # 1-3\n    Q = Fila()                                      # 8\n    Q.enqueue(s)                                    # 9\n    ordem = []\n    while not Q.esta_vazia():                       # 10\n        _, u = Q.dequeue()                          # 11\n        ordem.append(u)\n        for v in G.vizinhos(u):                     # 12\n            if cor[v] == BRANCO:                    # 13\n                cor[v] = CINZA                      # 14\n                d[v] = d[u] + 1                     # 15\n                pi[v] = u                           # 16\n                Q.enqueue(v)                        # 17\n        cor[u] = PRETO                              # 18\n    return d, pi, ordem, Q.maior_tamanho"}, {"titulo": "BFS no espaço de estados (o solver da dica)", "nome": "bfs", "arquivo": "algoritmos/solver.py", "linha": 125, "codigo": "def bfs(problema):\n    \"\"\"\n    Mesma estrutura do BFS da aula 09, trocando \"vértice\" por \"estado\":\n        Q <- ∅; enqueue(Q, s)\n        enquanto Q != ∅:\n            u <- dequeue(Q)\n            se u é objetivo: pare\n            para cada sucessor v de u:\n                se v não é repetido: marque v; π[v] <- u; enqueue(Q, v)\n    \"\"\"\n    r, inicio = Resultado(\"BFS\"), time.perf_counter()\n    visitados = _Visitados(problema)\n    s = problema.estado_inicial()\n    pais = {s: (None, None)}            # π: só para reconstruir o caminho\n    visitados.marcar(s)\n    Q = Fila()\n    Q.enqueue(s)\n    while not Q.esta_vazia():\n        _, u = Q.dequeue()\n        r.expandidos += 1\n        r.ordem.append(u)\n        if problema.eh_objetivo(u):\n            r.passos.append((u, Q.para_lista()))\n            r.maior_fronteira = Q.maior_tamanho\n            return _finalizar(r, problema, pais, u, visitados, inicio)\n        for acao, v, _ in problema.sucessores(u):\n            r.gerados += 1\n            if visitados.eh_repetido(v):\n                r.repetidos += 1\n                continue\n            visitados.marcar(v)\n            pais[v] = (u, acao)\n            r.arvore.append((u, acao, v))\n            Q.enqueue(v)\n        r.passos.append((u, Q.para_lista()))\n    r.maior_fronteira = Q.maior_tamanho\n    return _finalizar(r, problema, pais, None, visitados, inicio)"}], "f4": [{"titulo": "Inserção na AVL — aula 08", "nome": "ArvoreAVL._insere", "arquivo": "estruturas/avl.py", "linha": 141, "codigo": "    def _insere(self, r, chave, valor):\n        \"\"\"\n        insere (r, x)                                  [Aula 08, slides 20-21]\n        Recursiva: o caso-base é a árvore vazia (linha 1).\n        \"\"\"\n        # 1-3: caso-base — achou o lugar vazio: o novo nó vira esta subárvore\n        if r is None:\n            self._inseriu = True\n            return NoAVL(chave, valor)\n\n        # [acréscimo da equipe] chave igual = já existe; nada muda\n        if chave == r.chave:\n            return r\n\n        if chave < r.chave:                                   # 4: vai para a esquerda\n            r.esq = self._insere(r.esq, chave, valor)         # 5: chamada recursiva\n            if altura(r.esq) - altura(r.dir) == 2:            # 6: desbalanceou (FB=+2)\n                if chave < r.esq.chave:                       # 7: esq + esq = \"reta\"\n                    self._registrar(\"RD\", r)\n                    r = self._rotacao_direita(r)              # 8\n                else:                                         # 9: esq + dir = \"curva\"\n                    self._registrar(\"RED\", r)\n                    r = self._rotacao_esquerda_direita(r)     # 10\n        else:                                                 # 11: vai para a direita\n            r.dir = self._insere(r.dir, chave, valor)         # 12\n            if altura(r.esq) - altura(r.dir) == -2:           # 13: desbalanceou (FB=-2)\n                if chave > r.dir.chave:                       # 14: dir + dir = \"reta\"\n                    self._registrar(\"RE\", r)\n                    r = self._rotacao_esquerda(r)             # 15\n                else:                                         # 16: dir + esq = \"curva\"\n                    self._registrar(\"RDE\", r)\n                    r = self._rotacao_direita_esquerda(r)     # 17\n\n        r.h = max(altura(r.esq), altura(r.dir)) + 1           # 18: atualiza a altura\n        return r                                              # 19"}, {"titulo": "Rotação direita (RD) — aula 08", "nome": "ArvoreAVL._rotacao_direita", "arquivo": "estruturas/avl.py", "linha": 57, "codigo": "    def _rotacao_direita(self, p):\n        \"\"\"\n        rotacaoDireita (p)                             [Aula 08, slide 16]\n        1. u <- p.esq\n        2. p.esq <- u.dir\n        3. u.dir <- p\n        4. p.h <- max(altura(p.esq), altura(p.dir)) + 1\n        5. u.h <- max(altura(u.esq), p.h) + 1\n        6. retorna u\n                p                u\n               / \\\\             / \\\\\n              u   T3   ==>    T1   p\n             / \\\\                  / \\\\\n           T1   T2               T2   T3\n        \"\"\"\n        u = p.esq                                         # 1\n        p.esq = u.dir                                     # 2\n        u.dir = p                                         # 3\n        p.h = max(altura(p.esq), altura(p.dir)) + 1       # 4\n        u.h = max(altura(u.esq), p.h) + 1                 # 5\n        return u                                          # 6"}, {"titulo": "Rotação dupla esquerda-direita (RED) — aula 08", "nome": "ArvoreAVL._rotacao_esquerda_direita", "arquivo": "estruturas/avl.py", "linha": 101, "codigo": "    def _rotacao_esquerda_direita(self, p):\n        \"\"\"\n        rotacaoEsquerdaDireita (p)                     [Aula 08, slide 18]\n        1. u <- p.esq\n        2. p.esq <- rotacaoEsquerda(u)\n        3. retorna rotacaoDireita(p)\n        Rotação dupla = composição de duas rotações simples.\n        \"\"\"\n        u = p.esq                                         # 1\n        p.esq = self._rotacao_esquerda(u)                 # 2\n        return self._rotacao_direita(p)                   # 3"}, {"titulo": "A AVL como memória de estados visitados", "nome": "_Visitados", "arquivo": "algoritmos/solver.py", "linha": 72, "codigo": "class _Visitados:\n    \"\"\"Controle de visitados com AVL + dominância por recurso.\"\"\"\n\n    def __init__(self, problema):\n        self.problema = problema\n        self.avl = ArvoreAVL()\n\n    def eh_repetido(self, estado):\n        achou, melhor, _ = self.avl.buscar(self.problema.chave(estado))\n        return achou and self.problema.recurso(estado) <= melhor\n\n    def marcar(self, estado):\n        chave, rec = self.problema.chave(estado), self.problema.recurso(estado)\n        if not self.avl.inserir(chave, rec):\n            self.avl.atualizar_valor(chave, rec)\n\n    def preencher(self, r):\n        r.avl_altura = self.avl.altura()\n        r.avl_nos = len(self.avl)\n        r.avl_rotacoes = sum(self.avl.rotacoes.values())"}], "f5": [{"titulo": "Auditoria da Fase 2: refaz cada jogada pelas regras", "nome": "Fase5.etapa_triagem", "arquivo": "jogo/fase5.py", "linha": 71, "codigo": "    def etapa_triagem(self, acoes_do_jogador=None):\n        # aceita tanto [\"guardar\", ...] quanto o histórico da Fase 2: [(\"guardar\", \"E1\"), ...]\n        if acoes_do_jogador:\n            acoes_do_jogador = [a[0] if isinstance(a, tuple) else a for a in acoes_do_jogador]\n            f = Fase2()\n            passos_ok = all(f.executar(a)[0] for a in acoes_do_jogador)\n            ok, origem, acoes = passos_ok and f.venceu(), \"jogador (validado pelo solver)\", list(acoes_do_jogador)\n            metricas = \"ações do jogador reexecutadas uma a uma com as regras R1-R5\"\n        else:\n            r = bfs(ProblemaTriagem())\n            ok, origem, acoes = r.encontrou, \"solver (BFS)\", [a for a, _ in r.caminho[1:]]\n            metricas = (f\"{r.expandidos} estados expandidos, {r.repetidos} repetidos ignorados, \"\n                        f\"{r.tempo_ms:.3f} ms\")\n        self.etapas[\"triagem\"] = {\n            \"ok\": ok, \"origem\": origem, \"detalhe\": \" -> \".join(acoes), \"metricas\": metricas,\n            \"checagens\": [(\"custódia E2 -> E4 -> E1 -> E6, fila e pilha vazias\", ok)],\n        }\n        return self.etapas[\"triagem\"]"}, {"titulo": "Auditoria da Fase 3: refaz cada passo pelas regras", "nome": "Fase5.etapa_mapa", "arquivo": "jogo/fase5.py", "linha": 91, "codigo": "    def etapa_mapa(self, trilha_do_jogador=None):\n        G = construir_mapa()\n        if trilha_do_jogador and len(trilha_do_jogador) > 1:\n            e, valido = estado_inicial(), True\n            for v in trilha_do_jogador[1:]:\n                valido, e, _ = mover(G, e, v)\n                if not valido:\n                    break\n            ok = valido and e[0] == DESTINO\n            origem, trilha, final = \"jogador (validado pelo solver)\", list(trilha_do_jogador), e\n            metricas = \"cada movimento conferido pela função mover() (regras R1-R5)\"\n        else:\n            r = bfs(ProblemaMapa(G))\n            ok, origem = r.encontrou, \"solver (BFS)\"\n            trilha = [e[0] for _, e in r.caminho]\n            final = r.caminho[-1][1] if r.encontrou else None\n            metricas = (f\"{r.expandidos} estados expandidos, {r.repetidos} repetidos ignorados, \"\n                        f\"custo {r.custo}, {r.tempo_ms:.3f} ms\")\n        self.etapas[\"mapa\"] = {\n            \"ok\": ok, \"origem\": origem, \"detalhe\": \" -> \".join(trilha), \"metricas\": metricas,\n            \"final\": rotulo(final) if final else \"-\",\n            \"checagens\": [(\"chegou ao Centro de Validação com AUT, sem violar portas\", ok)],\n        }\n        return self.etapas[\"mapa\"]"}, {"titulo": "DFS recursiva (caso-base e retorno)", "nome": "dfs_recursiva", "arquivo": "algoritmos/solver.py", "linha": 165, "codigo": "def dfs_recursiva(problema):\n    \"\"\"\n    Mesma estrutura do visitaDFS da aula 09:\n        visita(u):\n            CASO-BASE 1: u é objetivo        -> devolve \"achei\"\n            para cada sucessor v de u:\n                se v não é repetido:\n                    marque v; π[v] <- u\n                    CHAMADA RECURSIVA: visita(v)\n                    se achou: devolve \"achei\" (CONDIÇÃO DE RETORNO)\n            CASO-BASE 2: nenhum sucessor levou ao objetivo -> devolve \"não achei\"\n    A \"pilha\" aqui é a pilha de chamadas do Python; medimos sua profundidade.\n    \"\"\"\n    r, inicio = Resultado(\"DFS (recursiva)\"), time.perf_counter()\n    visitados = _Visitados(problema)\n    s = problema.estado_inicial()\n    pais = {s: (None, None)}\n    visitados.marcar(s)\n\n    chamadas = []                       # espelho da pilha de chamadas, só para animação\n\n    def visita(u, profundidade):\n        chamadas.append(u)\n        r.expandidos += 1\n        r.ordem.append(u)\n        r.passos.append((u, list(reversed(chamadas))))\n        r.maior_fronteira = max(r.maior_fronteira, profundidade)\n        if problema.eh_objetivo(u):                       # caso-base 1\n            return u\n        for acao, v, _ in problema.sucessores(u):\n            r.gerados += 1\n            if visit function desenhaMapa(svg, opt) {
  const F = D.fase3, POS = {}; F.vertices.forEach(v => POS[v.id] = v);
  svg.innerHTML = ""; svg.setAttribute("viewBox", "-30 70 790 480"); svg.setAttribute("width", "100%");
  const cam = new Set(), ar = new Set(); (opt.caminho || []).forEach((v, k, a) => { cam.add(v); if (k) ar.add([a[k - 1], v].sort().join()); });
  F.arestas.forEach(([u, v]) => svgEl("line", {x1: POS[u].x, y1: POS[u].y, x2: POS[v].x, y2: POS[v].y, stroke: ar.has([u, v].sort().join()) ? "#ffb347" : "#6b5236", "stroke-width": ar.has([u, v].sort().join()) ? 7 : 4}, svg));
  // posição do nome de cada local; no mapa com custos, o nome de C vai para a esquerda para dar lugar ao custo de C-E
  const rot = v => opt.pesos && v.id === "C" ? [v.x - 38, v.y + 6, "end"] : [v.x, v.y + (v.id === "G" ? -40 : 50), "middle"];
  const caixas = []; F.vertices.forEach(v => { caixas.push([v.x, v.y, 34, 34]);           // círculo e rótulos de cada local
    const [lx, ly, al] = rot(v), hw = v.nome.length * 4.8 + 4; caixas.push([al === "end" ? lx - hw : lx, ly - 5, hw, 11]);
    if (v.pista || v.porta) caixas.push([v.x, v.y + 64, 58, 11]); });
  const livre = (x, y) => caixas.every(([cx, cy, hw, hh]) => Math.abs(x - cx) > hw + 15 || Math.abs(y - cy) > hh + 15);
  const lugar = (a, b) => { const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy), nx = -dy / L, ny = dx / L;   // procura um ponto da linha sem texto em cima
    for (const t of [.5, .42, .58, .34, .66]) for (const o of [0, 24, -24]) { const x = a.x + dx * t + nx * o, y = a.y + dy * t + ny * o; if (livre(x, y)) return [x, y]; }
    return [a.x + dx / 2 + nx * 24, a.y + dy / 2 + ny * 24]; };
  if (opt.pesos) F.arestas.forEach(([u, v]) => { const w = opt.pesos[u + "-" + v], [mx, my] = lugar(POS[u], POS[v]);
    svgEl("circle", {cx: mx, cy: my, r: 15, fill: w >= 5 ? "#b5321e" : "#15110c", stroke: "#ffb347", "stroke-width": 2}, svg);
    svgEl("text", {x: mx, y: my + 6, "text-anchor": "middle", "font-size": 17, "font-weight": 700, style: "fill:#fff6e4"}, svg, w); });
  const viz = new Set(opt.vizinhos || []);
  F.vertices.forEach(v => { const g = svgEl("g", {style: opt.clique ? "cursor:pointer" : ""}, svg);
    let f = "#2a1d12"; if (cam.has(v.id)) f = "#a9481a"; if (viz.has(v.id)) f = "#1f5f5b"; if (v.id === opt.atual) f = "#ffb347";
    if (v.id === opt.brilho) { const c = svgEl("circle", {cx: v.x, cy: v.y, r: 34, fill: "none", stroke: "#7CFC9A", "stroke-width": 5}, g);   // dica: o próximo local pulsa
      svgEl("animate", {attributeName: "r", values: "34;46;34", dur: "1.1s", repeatCount: "indefinite"}, c); }
    svgEl("circle", {cx: v.x, cy: v.y, r: 30, fill: f, stroke: viz.has(v.id) ? "#fff6e4" : "#ffb347", "stroke-width": viz.has(v.id) ? 4 : 2, "stroke-dasharray": viz.has(v.id) ? "6 4" : ""}, g);
    svgEl("text", {x: v.x, y: v.y + 9, "text-anchor": "middle", "font-size": 26, "font-weight": 700, style: v.id === opt.atual ? "fill:#15110c" : ""}, g, v.id);
    const [lx, ly, al] = rot(v); svgEl("text", {x: lx, y: ly, "text-anchor": al, "font-size": 15}, g, v.nome);
    if (v.pista || v.porta) svgEl("text", {x: v.x, y: v.y + 69, "text-anchor": "middle", "font-size": 15, style: "fill:#ff8a3d"}, g, v.pista ? "🔑 pista " + v.pista : "🔒 exige " + v.porta);
    if (opt.clique) g.onclick = () => opt.clique(v.id); });
  if (opt.atual) {        // o marcador da analista: sai de onde estava (opt.de) e desliza até o local atual
    const a = POS[opt.de || opt.atual], b = POS[opt.atual], t = p => `translate(${p.x + 24}px, ${p.y - 28}px)`;
    const g = svgEl("g", {style: `transform:${t(a)};transition:transform .45s ease;pointer-events:none`}, svg);
    svgEl("circle", {cx: 0, cy: 0, r: 17, fill: "#fff6e4", stroke: "#d9682b", "stroke-width": 3}, g);
    svgEl("text", {x: 0, y: 7, "text-anchor": "middle", "font-size": 19}, g, "🕵️");
    if (opt.de && opt.de !== opt.atual) requestAnimationFrame(() => requestAnimationFrame(() => g.style.transform = t(b)));
  }
}
