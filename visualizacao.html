<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Audiência Pública da CIV — Verídia 2042</title>
<style>
  /* Paleta retrofuturista de repartição dos anos 1960 (criação própria) */
  :root {
    --parede: #3a2516; --parede2: #4a301c; --papel: #f4e7c9; --papel2: #eadbb6; --tinta: #2b1d12;
    --tinta2: #6b5236; --laranja: #d9682b; --laranja2: #b8521c; --petroleo: #1f5f5b; --petroleo2: #2d7a74;
    --ambar: #ffb347; --crt: #15110c; --verde: #2e7d4f; --vermelho: #b5321e;
    --titulo: "Futura", "Century Gothic", "Avenir Next", "Trebuchet MS", sans-serif;
    --maquina: "Courier New", "Courier", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--parede); color: var(--tinta); font: 17px/1.55 Georgia, "Times New Roman", serif;
         background-image: repeating-linear-gradient(90deg, rgba(255,255,255,.025) 0 40px, transparent 40px 80px); }
  /* barra superior tipo painel */
  .painel { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 14px;
            background: linear-gradient(#2a1a0f, #1d120a); border-bottom: 4px solid var(--laranja);
            padding: 8px 18px; color: var(--papel); }
  .painel .marca { font-family: var(--titulo); letter-spacing: .14em; font-size: 13px; text-transform: uppercase; }
  .painel .luzes { display: flex; gap: 6px; margin-left: auto; }
  .painel .luz { width: 12px; height: 12px; border-radius: 50%; background: #4a3a2a; box-shadow: inset 0 0 3px #000; }
  .painel .luz.acesa { background: var(--ambar); box-shadow: 0 0 8px var(--ambar); }
  .painel button { font-family: var(--titulo); text-transform: uppercase; letter-spacing: .08em; font-size: 12px;
                   background: var(--petroleo); color: var(--papel); border: 2px solid #0e3533; border-radius: 4px;
                   padding: 5px 10px; cursor: pointer; }
  .progresso { height: 4px; background: #1d120a; } .progresso div { height: 100%; background: var(--ambar); width: 0; transition: width .3s; }
  main { max-width: 1120px; margin: 0 auto; padding: 22px 18px 90px; }
  /* cada slide é uma ficha de papel */
  .slide { background: var(--papel); border-radius: 6px; padding: 30px 36px 34px; margin: 0 0 26px;
           box-shadow: 0 10px 0 var(--parede2), 0 14px 30px rgba(0,0,0,.45); position: relative; min-height: 560px; }
  .slide::before { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 10px; border-radius: 6px 6px 0 0;
                   background: repeating-linear-gradient(90deg, var(--laranja) 0 30px, var(--petroleo) 30px 60px); }
  body.modo-slides .slide { display: none; } body.modo-slides .slide.atual { display: block; }
  .rotulo { font-family: var(--titulo); text-transform: uppercase; letter-spacing: .16em; font-size: 12px; color: var(--laranja2); }
  h1, h2, h3 { font-family: var(--titulo); text-transform: uppercase; letter-spacing: .05em; margin: 4px 0 12px; color: var(--tinta); }
  h1 { font-size: 34px; } h2 { font-size: 26px; } h3 { font-size: 17px; letter-spacing: .08em; }
  p { margin: 0 0 12px; }
  .dois { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; }
  .tres { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  @media (max-width: 820px) { .dois, .tres { grid-template-columns: 1fr; } .slide { padding: 24px 18px; } }
  /* documento datilografado */
  .doc { font-family: var(--maquina); background: #fbf3df; border: 1px solid #cdb98f; padding: 12px 16px; font-size: 15px;
         white-space: pre-line; box-shadow: 2px 2px 0 #d9c69d; }
  /* monitor de tubo (CRT) */
  .crt { background: var(--crt); color: var(--ambar); font-family: var(--maquina); border-radius: 14px; padding: 14px 16px;
         border: 10px solid #5b4632; box-shadow: inset 0 0 30px rgba(255,179,71,.18), 0 0 0 2px #2a1d12;
         background-image: repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 1px, transparent 1px 3px); position: relative; overflow-x: auto; }
  .crt .tit { font-family: var(--titulo); letter-spacing: .12em; font-size: 12px; text-transform: uppercase; color: #d79b4b; margin-bottom: 6px; }
  .crt svg text { fill: var(--ambar); font-family: var(--maquina); }
  /* fala da auditora e do APURA-42 */
  .fala { display: flex; gap: 14px; align-items: flex-start; margin: 10px 0 16px; }
  .fala .quem { flex: 0 0 auto; }
  .balao { background: #fff8e8; border: 2px solid var(--tinta); border-radius: 14px; padding: 10px 14px; position: relative; max-width: 760px; }
  .balao::before { content: ""; position: absolute; left: -11px; top: 18px; border: 10px solid transparent; border-right-color: var(--tinta); border-left: 0; }
  .balao b.nome { font-family: var(--titulo); text-transform: uppercase; letter-spacing: .08em; font-size: 12px; color: var(--laranja2); display: block; }
  /* botões */
  .btn { font-family: var(--titulo); text-transform: uppercase; letter-spacing: .06em; font-size: 13px; cursor: pointer;
         background: var(--laranja); color: #fff6e4; border: 2px solid var(--laranja2); border-bottom-width: 5px;
         border-radius: 6px; padding: 7px 12px; margin: 3px 4px 3px 0; }
  .btn:active { transform: translateY(2px); border-bottom-width: 3px; }
  .btn.sec { background: var(--petroleo); border-color: #0e3533; }
  .btn.neutro { background: var(--papel2); color: var(--tinta); border-color: var(--tinta2); }
  .btn:disabled { opacity: .45; cursor: default; }
  .controles { display: flex; flex-wrap: wrap; align-items: center; gap: 2px; margin: 8px 0; }
  .controles .passo { font-family: var(--maquina); font-size: 14px; color: var(--tinta2); margin-left: 8px; }
  select { font: inherit; font-family: var(--titulo); font-size: 13px; padding: 6px; border: 2px solid var(--tinta2); background: #fff8e8; border-radius: 6px; }
  /* carimbo */
  .carimbo { display: inline-block; font-family: var(--titulo); text-transform: uppercase; letter-spacing: .12em; font-weight: 700;
             color: var(--vermelho); border: 4px double var(--vermelho); padding: 6px 14px; transform: rotate(-6deg); border-radius: 6px;
             background: rgba(181,50,30,.05); font-size: 20px; }
  .carimbo.verde { color: var(--verde); border-color: var(--verde); }
  /* fichas, filas, pilhas */
  .ficha { display: inline-block; font-family: var(--maquina); background: #fff8e8; border: 2px solid var(--tinta2); border-radius: 5px;
           padding: 4px 9px; margin: 3px; font-size: 15px; }
  .ficha.destaque { background: var(--ambar); border-color: var(--laranja2); }
  .linha { display: flex; flex-wrap: wrap; align-items: center; min-height: 44px; }
  .seta { color: var(--tinta2); margin: 0 2px; }
  .pilha { display: flex; flex-direction: column; align-items: flex-start; min-height: 44px; }
  .caixa { background: #fbf3df; border: 2px dashed #cdb98f; border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
  .caixa h3 { font-size: 13px; margin: 0 0 6px; color: var(--tinta2); }
  table.reg { border-collapse: collapse; font-family: var(--maquina); font-size: 14px; width: 100%; }
  table.reg th { font-family: var(--titulo); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; text-align: left; color: var(--tinta2); border-bottom: 2px solid var(--tinta2); padding: 4px 6px; }
  table.reg td { border-bottom: 1px dotted #cdb98f; padding: 3px 6px; }
  table.reg tr.hl td { background: var(--ambar); color: #15110c !important; font-weight: 700; }
  table.reg tr.erro td { background: #f2b8a8; }
  /* ficha técnica (para a professora) */
  details.tecnica { margin-top: 18px; border: 2px solid var(--petroleo); border-radius: 8px; background: #e6efe9; }
  details.tecnica summary { cursor: pointer; padding: 8px 14px; font-family: var(--titulo); text-transform: uppercase; letter-spacing: .08em; font-size: 13px; color: var(--petroleo); }
  details.tecnica div { padding: 0 16px 12px; font-size: 15px; }
  details.tecnica code { font-family: var(--maquina); background: #fff; padding: 0 4px; border-radius: 3px; }
  .analogia { background: #fff3d6; border-left: 6px solid var(--laranja); padding: 10px 14px; margin: 10px 0; border-radius: 0 8px 8px 0; }
  .analogia b { font-family: var(--titulo); text-transform: uppercase; letter-spacing: .06em; font-size: 13px; color: var(--laranja2); }
  .msg { font-family: var(--maquina); background: #fff8e8; border: 2px solid var(--tinta2); border-radius: 6px; padding: 8px 12px; margin-top: 10px; min-height: 42px; white-space: pre-line; }
  .msg.ok { border-color: var(--verde); background: #e5f2e6; } .msg.nao { border-color: var(--vermelho); background: #f8e1da; }
  .selos { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 10px; margin-top: 14px; }
  .selo { text-align: center; background: #fbf3df; border: 2px solid var(--tinta2); border-radius: 10px; padding: 10px 6px; font-size: 14px; }
  .selo .disco { width: 54px; height: 54px; border-radius: 50%; margin: 0 auto 6px; background: radial-gradient(circle at 35% 35%, #e98a4a, var(--laranja2));
                 border: 3px solid #7a3510; color: #fff6e4; font-family: var(--titulo); font-size: 22px; line-height: 48px; }
  .legenda { font-size: 14px; color: var(--tinta2); }
  .nav-rodape { position: fixed; bottom: 14px; left: 50%; transform: translateX(-50%); z-index: 10; display: flex; gap: 8px; align-items: center;
                background: #1d120a; border: 3px solid var(--laranja); border-radius: 30px; padding: 6px 12px; color: var(--papel); font-family: var(--maquina); }
  body:not(.modo-slides) .nav-rodape { display: none; }
  .nav-rodape button { background: var(--laranja); color: #fff6e4; border: 0; border-radius: 20px; padding: 6px 14px; font-family: var(--titulo); cursor: pointer; }
  table.glos { border-collapse: collapse; width: 100%; font-size: 15px; }
  table.glos th { font-family: var(--titulo); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; text-align: left; color: var(--tinta2); border-bottom: 2px solid var(--tinta2); padding: 6px; }
  table.glos td { border-bottom: 1px dotted #cdb98f; padding: 6px; vertical-align: top; }
  table.glos td:first-child { font-family: var(--titulo); font-weight: 700; text-transform: uppercase; font-size: 13px; letter-spacing: .04em; color: var(--laranja2); white-space: nowrap; }
</style>
</head>

/* controle de passos para animações (escopo: um elemento) */
function Passos(caixa, total, desenha, ms = 800) {
  let i = 0, timer = null;
  caixa.innerHTML = `<button class="btn neutro" data-c="inicio">⏮</button><button class="btn neutro" data-c="voltar">◀</button>
    <button class="btn" data-c="tocar">▶ tocar</button><button class="btn neutro" data-c="avancar">▶|</button>
    <button class="btn neutro" data-c="fim">⏭</button><span class="passo"></span>`;
  const ir = n => { i = Math.max(0, Math.min(total() - 1, n)); caixa.querySelector(".passo").textContent = `passo ${i + 1} de ${total()}`; desenha(i); };
  caixa.querySelectorAll("button").forEach(b => b.onclick = () => {
    const c = b.dataset.c;
    if (c === "tocar") {
      if (timer) { clearInterval(timer); timer = null; b.textContent = "▶ tocar"; return; }
      b.textContent = "⏸ pausar";
      timer = setInterval(() => { if (i >= total() - 1) { clearInterval(timer); timer = null; b.textContent = "▶ tocar"; } else ir(i + 1); }, ms);
    } else ir({inicio: 0, voltar: i - 1, avancar: i + 1, fim: total() - 1}[c]);
  });
  return { ir, reiniciar: () => ir(0) };
}

/* ===================== CAPÍTULO 4 ===================== */
const AV = D.avl;
function desenhaAVL(svg, raiz, destaque) {
  svg.innerHTML = ""; if (!raiz) { svg.setAttribute("viewBox", "0 0 300 60"); svg.setAttribute("width", 300); svgEl("text", {x: 10, y: 35}, svg, "(cofre vazio)"); return; }
  const nos = []; let x = 0; (function io(n, d) { if (!n) return; io(n.e, d + 1); nos.push({n, x: x++, d}); io(n.d, d + 1); })(raiz, 0);
  const DX = 62, DY = 70, W = nos.length * DX + 40, H = (Math.max(...nos.map(o => o.d)) + 1) * DY + 30;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("width", W); svg.style.maxWidth = "100%";
  const P = new Map(); nos.forEach(o => P.set(o.n, {x: o.x * DX + 40, y: o.d * DY + 32}));
  nos.forEach(o => ["e", "d"].forEach(l => { if (o.n[l]) { const a = P.get(o.n), b = P.get(o.n[l]); svgEl("line", {x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: "#6b5236", "stroke-width": 3}, svg); } }));
  nos.forEach(o => { const p = P.get(o.n), ruim = Math.abs(o.n.fb) > 1;
    svgEl("circle", {cx: p.x, cy: p.y, r: 20, fill: o.n.k === destaque ? "#ffb347" : "#2a1d12", stroke: ruim ? "#ff6b4a" : "#ffb347", "stroke-width": ruim ? 4 : 2}, svg);
    svgEl("text", {x: p.x, y: p.y + 5, "text-anchor": "middle", "font-weight": 700, style: o.n.k === destaque ? "fill:#15110c" : ""}, svg, o.n.k);
    svgEl("text", {x: p.x, y: p.y + 34, "text-anchor": "middle", "font-size": 11}, svg, `FB ${o.n.fb > 0 ? "+" : ""}${o.n.fb}`); });
}

const slides = [...document.querySelectorAll(".slide")];
let atual = 0;
const luzes = $("#luzes"); luzes.innerHTML = slides.map(() => '<span class="luz"></span>').join("");
function mostrar(n) {
  atual = Math.max(0, Math.min(slides.length - 1, n));
  slides.forEach((s, i) => s.classList.toggle("atual", i === atual));
  [...luzes.children].forEach((l, i) => l.classList.toggle("acesa", i <= atual));
  $("#contador").textContent = `${atual + 1} / ${slides.length}`;
  $("#barra").style.width = ((atual + 1) / slides.length * 100) + "%";
  if (document.body.classList.contains("modo-slides")) window.scrollTo(0, 0);
}
$("#ant").onclick = () => mostrar(atual - 1); $("#prox").onclick = () => mostrar(atual + 1);
document.addEventListener("keydown", e => {
  if (!document.body.classList.contains("modo-slides") || ["SELECT", "INPUT"].includes(document.activeElement.tagName)) return;
  if (["ArrowRight", "PageDown"].includes(e.key)) mostrar(atual + 1);
  if (["ArrowLeft", "PageUp"].includes(e.key)) mostrar(atual - 1);
});
$("#modo").onclick = () => { const s = document.body.classList.toggle("modo-slides"); $("#modo").textContent = s ? "Modo leitura" : "Modo slides"; mostrar(atual); };
mostrar(0);
