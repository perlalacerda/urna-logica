<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Urna Lógica — Jogo</title>
<style>
  :root {
    --parede: #2e1d11; --painel: #3a2516; --papel: #f6ead0; --papel2: #fbf3df; --tinta: #2b1d12; --tinta2: #6b5236;
    --laranja: #d9682b; --laranja2: #a9481a; --petroleo: #1f5f5b; --petroleo2: #164844; --ambar: #ffb347;
    --crt: #15110c; --verde: #2e7d4f; --vermelho: #b5321e; --borda: #cdb98f;
    --titulo: "Futura", "Century Gothic", "Avenir Next", "Trebuchet MS", sans-serif;
    --maquina: "Consolas", "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--parede); color: var(--tinta); font: 17px/1.5 "Segoe UI", system-ui, sans-serif; }
  header.topo { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
                background: #1d120a; color: var(--papel); padding: 10px 18px; border-bottom: 4px solid var(--laranja); }
  header.topo .marca { font-family: var(--titulo); letter-spacing: .1em; text-transform: uppercase; font-size: 14px; font-weight: 700; }
  .selos { display: flex; gap: 8px; margin-left: auto; }
  .selo { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-family: var(--titulo); font-weight: 700;
          background: #4a3a2a; color: #9c8a73; border: 2px solid #6b5236; font-size: 15px; }
  .selo.ok { background: radial-gradient(circle at 35% 35%, #f19a5c, var(--laranja2)); color: #fff6e4; border-color: var(--ambar); box-shadow: 0 0 10px rgba(255,179,71,.5); }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
  .folha { background: var(--papel); border-radius: 8px; padding: 22px 26px; box-shadow: 0 8px 0 #1d120a; margin-bottom: 18px; }
  h1, h2, h3 { font-family: var(--titulo); margin: 0 0 10px; }
  h1 { font-size: 28px; } h2 { font-size: 22px; } h3 { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--tinta2); }
  p { margin: 0 0 10px; }
  .agora { background: #fff3d6; border: 3px solid var(--laranja); border-radius: 10px; padding: 12px 16px; margin: 12px 0; font-size: 18px; }
  .agora b { font-family: var(--titulo); letter-spacing: .06em; color: var(--laranja2); display: block; font-size: 13px; text-transform: uppercase; }
  .msg { border-radius: 8px; padding: 12px 16px; margin: 12px 0; font-size: 17px; white-space: pre-line; border: 2px solid var(--tinta2); background: var(--papel2); min-height: 50px; }
  .msg.ok { border-color: var(--verde); background: #e3f1e5; } .msg.nao { border-color: var(--vermelho); background: #f8e1da; }
  .msg:empty { display: none; }
  .msg.dica { border-color: var(--petroleo); background: #e0eeec; }
  .msg.vitoria { border-color: var(--ambar); background: #fff1cf; font-size: 20px; font-weight: 600; }
  button { font: inherit; cursor: pointer; }
  .btn { font-family: var(--titulo); font-size: 17px; font-weight: 700; letter-spacing: .03em;
         background: var(--laranja); color: #fff8ec; border: 0; border-bottom: 5px solid var(--laranja2);
         border-radius: 10px; padding: 12px 18px; margin: 4px 6px 4px 0; min-height: 50px; }
  .btn:hover { filter: brightness(1.07); } .btn:active { transform: translateY(2px); border-bottom-width: 3px; }
  .btn.sec { background: var(--petroleo); border-bottom-color: var(--petroleo2); }
  .btn.neutro { background: #e6d6b2; color: var(--tinta); border-bottom-color: #b9a37a; }
  .btn.grande { font-size: 20px; padding: 16px 22px; min-width: 220px; }
  .btn:disabled { opacity: .4; cursor: default; }
  .grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
  .cartao { background: var(--papel2); border: 2px solid var(--borda); border-radius: 10px; padding: 14px; }
  .cartao .btn { width: 100%; margin-top: 8px; }
  .dois { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; }
  @media (max-width: 820px) { .dois { grid-template-columns: 1fr; } .folha { padding: 18px 16px; } }
  .caixa { background: var(--papel2); border: 2px dashed var(--borda); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
  .ficha { display: inline-block; font-family: var(--maquina); background: #fff; border: 2px solid var(--tinta2); border-radius: 6px;
           padding: 6px 12px; margin: 3px; font-size: 17px; font-weight: 700; }
  .ficha.destaque { background: var(--ambar); border-color: var(--laranja2); }
  .vazia { color: var(--tinta2); font-style: italic; }
  table.reg { border-collapse: collapse; width: 100%; font-family: var(--maquina); font-size: 15px; }
  table.reg th { text-align: left; font-family: var(--titulo); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--tinta2);
                 border-bottom: 2px solid var(--tinta2); padding: 6px; }
  table.reg td { padding: 5px 6px; border-bottom: 1px dotted var(--borda); }
  table.reg tr.erro td { background: #f6c5b8; }
  .escolha { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 12px; }
  .escolha button { font-family: var(--titulo); font-weight: 700; font-size: 16px; border-radius: 8px; padding: 10px 14px;
                    border: 2px solid var(--tinta2); background: #fff8ec; color: var(--tinta); }
  .escolha button.sel { background: var(--petroleo); color: #fff; border-color: var(--petroleo2); }
  .crt { background: var(--crt); border: 8px solid #5b4632; border-radius: 12px; padding: 8px; }
  .crt svg text { fill: var(--ambar); font-family: var(--maquina); }
  .legenda { font-size: 14px; color: var(--tinta2); }
  details { margin: 10px 0; } summary { cursor: pointer; font-family: var(--titulo); font-weight: 700; color: var(--petroleo); }
  .doc { font-family: var(--maquina); background: var(--papel2); border-left: 5px solid var(--laranja); padding: 10px 14px; white-space: pre-line; font-size: 15px; }
  .barra { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 10px; padding-top: 10px; border-top: 2px dotted var(--borda); }
  .codigo { font-family: var(--maquina); font-size: 14px; background: #efe3c4; border-radius: 4px; padding: 1px 6px; }
  table.metr { border-collapse: collapse; width: 100%; font-size: 15px; }
  table.metr th, table.metr td { border-bottom: 1px dotted var(--borda); padding: 6px; text-align: right; }
  table.metr th:first-child, table.metr td:first-child, table.metr th:nth-child(2), table.metr td:nth-child(2) { text-align: left; }
  /* ---------- abertura, tutorial, carimbo, estrelas ---------- */
  .capa { text-align: center; padding: 34px 26px; }
  .capa h1 { font-size: 34px; } .capa .linhas { font-size: 21px; line-height: 1.7; margin: 18px auto 24px; max-width: 640px; }
  .capa .linhas div::before { content: "▸ "; color: var(--laranja); }
  .veu { position: fixed; inset: 0; background: rgba(21,17,12,.72); z-index: 20; display: grid; place-items: center; padding: 16px; animation: aparece .2s; }
  .tut { background: var(--papel); border: 4px solid var(--laranja); border-radius: 14px; max-width: 600px; width: 100%; max-height: 88vh; overflow-y: auto; padding: 22px 24px; box-shadow: 0 10px 0 #1d120a; }
  .tut h2 { margin-bottom: 4px; } .tut .rotulo { font-family: var(--titulo); color: var(--laranja2); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
  .tut ol { font-size: 19px; padding-left: 26px; } .tut li { margin: 8px 0; } .tut .icone { font-size: 46px; float: right; margin-left: 12px; }
  .carimbo { width: 250px; height: 250px; border-radius: 50%; border: 10px double #fff1cf; background: radial-gradient(circle at 35% 30%, #f19a5c, var(--laranja2));
             color: #fff6e4; display: grid; place-items: center; text-align: center; font-family: var(--titulo); font-weight: 800;
             box-shadow: 0 0 40px rgba(255,179,71,.7); animation: carimba .55s cubic-bezier(.2,1.6,.4,1) both; cursor: pointer; }
  .carimbo .grande { font-size: 30px; letter-spacing: .06em; } .carimbo .est { font-size: 34px; letter-spacing: 4px; color: #ffe08a; }
  @keyframes carimba { 0% { transform: scale(3) rotate(-30deg); opacity: 0; } 60% { opacity: 1; } 100% { transform: scale(1) rotate(-12deg); } }
  @keyframes aparece { from { opacity: 0; } }
  .est-cartao { color: #e0a21b; font-size: 20px; letter-spacing: 2px; } .est-cartao .vazia-est { color: #cdb98f; }
  .som { margin-left: 8px; background: none; border: 2px solid #6b5236; color: var(--papel); border-radius: 8px; padding: 4px 10px; font-size: 14px; }
  /* ---------- Fase 1: chave e lote animado ---------- */
  .pecas button { font-size: 18px; padding: 12px 18px; }
  .pecas button:disabled { opacity: .35; }
  .slot { display: inline-flex; align-items: center; justify-content: center; min-width: 120px; height: 52px; border: 3px dashed var(--borda); border-radius: 10px;
          margin: 4px; font-family: var(--titulo); font-weight: 700; font-size: 17px; color: var(--tinta2); background: #fffaf0; }
  .slot.cheio { border-style: solid; border-color: var(--petroleo); background: var(--petroleo); color: #fff; cursor: pointer; }
  .slot .n { font-size: 12px; opacity: .7; margin-right: 6px; }
  .lote { position: relative; font-family: var(--maquina); font-size: 15px; }
  .lote .linha { position: absolute; left: 0; right: 0; height: 32px; display: grid; grid-template-columns: 40px 1.2fr 1fr 1fr 1fr 1.4fr 1.6fr;
                 align-items: center; padding: 0 6px; border-bottom: 1px dotted var(--borda); transition: top .22s ease, background .3s; background: var(--papel); }
  .lote .linha.mexeu { background: #ffe0a8; } .lote .linha.erro { background: #f6c5b8; }
  .lote .cab { position: static; font-family: var(--titulo); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--tinta2); border-bottom: 2px solid var(--tinta2); }
  .placar { scroll-margin-top: 84px; font-family: var(--maquina); font-size: 18px; background: var(--crt); color: var(--ambar); border-radius: 8px; padding: 8px 14px; display: inline-block; margin: 6px 0; }
  .ficha { transition: transform .35s ease; }
  /* ---------- modo aluno: narradora, termos, para decidir ---------- */
  .pearl { display: flex; gap: 12px; align-items: flex-start; background: #1f3d3b; color: #f3ead6; border-radius: 12px; padding: 12px 16px; margin: 10px 0; font-size: 17px; }
  .pearl .av { font-size: 40px; line-height: 1; } .pearl .quem { display: block; color: var(--ambar); font-family: var(--titulo); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; }
  .termo { display: inline-block; font: 600 14px var(--titulo); background: #e0eeec; color: var(--petroleo2); border: 2px solid var(--petroleo); border-radius: 999px;
           padding: 1px 10px; margin: 2px 3px; cursor: pointer; white-space: nowrap; vertical-align: middle; }
  .termo:hover { background: var(--petroleo); color: #fff; }
  .portras { background: #f1e7cf; border: 2px dashed var(--petroleo); border-radius: 10px; padding: 8px 12px; margin: 10px 0; font-size: 15px; }
  .portras > b { font-family: var(--titulo); color: var(--petroleo2); margin-right: 6px; }
  .decidir { background: #eef6f4; border-left: 6px solid var(--petroleo); border-radius: 8px; padding: 10px 14px; margin: 10px 0; font-size: 16px; }
  .decidir .rot { font-family: var(--titulo); color: var(--petroleo2); display: block; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; margin-bottom: 4px; }
  .metodos { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 10px; margin: 8px 0 12px; }
  .metodo { text-align: left; background: #fff8ec; border: 3px solid var(--borda); border-radius: 12px; padding: 12px 14px; font: inherit; color: var(--tinta); cursor: pointer; }
  .metodo .tit { font: 800 18px var(--titulo); display: block; margin-bottom: 4px; } .metodo .legenda { display: block; margin-top: 6px; }
  .metodo.sel { border-color: var(--petroleo); background: #dff0ed; box-shadow: 0 0 0 3px var(--petroleo) inset; }
  .metodo:disabled { opacity: .5; cursor: default; }
  .camada { font-size: 13px; color: var(--tinta2); font-weight: 400; text-transform: none; letter-spacing: 0; }
  .missoes { list-style: none; padding: 0; margin: 6px 0; font-size: 18px; } .missoes li { margin: 4px 0; } .missoes li.ok { color: var(--verde); text-decoration: line-through; }
  .abas { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; } .abas button { font: 700 16px var(--titulo); border: 2px solid var(--tinta2); border-radius: 8px 8px 0 0; padding: 8px 16px; background: #efe3c4; color: var(--tinta); }
  .abas button.sel { background: var(--petroleo); color: #fff; border-color: var(--petroleo2); } .abas button:disabled { opacity: .45; }
  .gloss h3 { margin-top: 12px; } .gloss .camada-t { font: 700 12px var(--titulo); letter-spacing: .06em; text-transform: uppercase; color: var(--laranja2); margin-top: 8px; display: block; }
  /* ---------- Fase 5: suspense ---------- */
  .chk { opacity: .25; transition: opacity .3s; } .chk.on { opacity: 1; }
  .cofre { font-size: 90px; text-align: center; animation: gira 1.2s ease both; }
  @keyframes gira { 0% { transform: rotate(0) scale(.6); } 70% { transform: rotate(360deg) scale(1.15); } 100% { transform: rotate(360deg) scale(1); } }
</style>
</head>
<body>
<header class="topo">
  <span class="marca">Urna Lógica · Verídia 2042</span>
  <button class="btn neutro" style="min-height:36px;padding:6px 12px;font-size:14px" onclick="ir('menu')">Menu</button>
  <div class="selos" id="selos" title="Selos conquistados"></div>
  <button class="som" onclick="abrirDicionario()" title="O que significa cada palavra do jogo">📖 Dicionário</button>
  <button class="som" id="som" onclick="P.som=!P.som;salvar();marcarSom()" title="Som do carimbo">🔇 som</button>
</header>
<main id="tela"></main>

<script>
const D = /*__DADOS__*/null;
const $ = s => document.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
function svgEl(tag, at, pai, txt) { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); if (txt !== undefined) e.textContent = txt; if (pai) pai.appendChild(e); return e; }
const fichas = (l, d0) => l.length ? l.map((x, i) => `<span class="ficha${d0 && i === 0 ? " destaque" : ""}" data-ficha="${x}">${x}</span>`).join("") : '<span class="vazia">(vazia)</span>';

/* ================= progresso (fica salvo no navegador, se possível) ================= */
const NOVO = () => ({ selos: [false, false, false, false, false],
  f1: { tentativas: [] }, f2: { atual: 0, hist: [], acoes: [] }, f3: { atual: 0, hist: [], trilha: ["A"] },
  f4: { k: 0, acertos: 0, palpites: [], pares: {} }, f5: { feito: false, alg: null },
  mc: { atual: 0, hist: [], trilha: ["A"], melhor: null }, estrelas: {}, tut: {}, som: false, capa: false });
let P = NOVO();
try { const s = localStorage.getItem("urna-logica"); if (s) P = Object.assign(NOVO(), JSON.parse(s)); } catch (e) {}
function salvar() { try { localStorage.setItem("urna-logica", JSON.stringify(P)); } catch (e) {} desenharSelos(); }
for (const k of ["f2", "f3", "mc"]) if (P[k].erros === undefined) P[k].erros = 0;   // progresso salvo por uma versão anterior

/* ================= estrelas, carimbo, tutorial, som ================= */
// As estrelas comparam a partida com o MÍNIMO calculado pelo Python (BFS nas Fases 2 e 3, Dijkstra no desafio extra).
const pintaEstrelas = n => n ? `<span class="est-cartao">${"★".repeat(n)}<span class="vazia-est">${"★".repeat(3 - n)}</span></span>` : "";
function ganharEstrelas(chave, n) { const antes = P.estrelas[chave] || 0; if (n > antes) P.estrelas[chave] = n; salvar(); return n; }
function marcarSom() { $("#som").textContent = P.som ? "🔊 som" : "🔇 som"; }
function tocarCarimbo() { if (!P.som) return; try { const c = new (window.AudioContext || window.webkitAudioContext)(), o = c.createOscillator(), g = c.createGain();
  o.type = "triangle"; o.frequency.setValueAtTime(180, c.currentTime); o.frequency.exponentialRampToValueAtTime(60, c.currentTime + .25);
  g.gain.setValueAtTime(.6, c.currentTime); g.gain.exponentialRampToValueAtTime(.001, c.currentTime + .35); o.connect(g); g.connect(c.destination); o.start(); o.stop(c.currentTime + .4); } catch (e) {} }
// proxima = [tela, rótulo]: o carimbo já oferece o botão para seguir (pedido: não obrigar a voltar ao menu).
const PROXIMA = {f1: ["f2", "Fase 2 — A Central de Triagem"], f2: ["f3", "Fase 3 — O Mapa das Seções"], f3: ["f4", "Fase 4 — O Cofre dos Estados"],
  f4: ["f5", "Fase 5 — A Auditoria Final"], f5: ["custos", "Desafio extra — Mapa com Custos"], custos: ["menu", "Menu"]};
const botaoProxima = de => `<button class="btn grande" onclick="ir('${PROXIMA[de][0]}')">▶ Ir para: ${PROXIMA[de][1]}</button>`;
function carimbo(titulo, estrelas, linha, de) {
  const v = document.createElement("div"); v.className = "veu";
  v.innerHTML = `<div style="text-align:center"><div class="carimbo"><div><div class="grande">${titulo}</div><div style="font-size:15px;margin:4px 0">CONQUISTADO</div>
    <div class="est">${"★".repeat(estrelas)}${"☆".repeat(3 - estrelas)}</div></div></div>
    <p style="color:#fff1cf;font-size:19px;max-width:480px;margin:22px auto 12px">${linha}</p>
    ${de ? `<button class="btn grande" id="cb-prox">▶ Ir para: ${PROXIMA[de][1]}</button>` : ""}
    <button class="btn neutro" id="cb-fica">Ficar aqui</button></div>`;
  document.body.appendChild(v); tocarCarimbo();
  $("#cb-fica").onclick = () => v.remove();
  if (de) $("#cb-prox").onclick = () => { v.remove(); ir(PROXIMA[de][0]); };
}

/* ================= DICIONÁRIO DO JOGO =================
   Cada termo tem três camadas: o que é NO JOGO (lúdico), o que lembra NA ELEIÇÃO de verdade
   (sem dados reais) e o CONCEITO DA AULA (a matemática e o algoritmo por trás). */
const GLOSS = {
  vetor: ["🗂️", "Lote de fichas (vetor)", "Uma fileira de gavetas numeradas 0, 1, 2… Dá para abrir qualquer gaveta direto pelo número.",
    "Cada ficha é o registro de uma seção: zona, seção, voto, horário e situação.", "Vetor: posições seguidas na memória, acessadas pelo índice em tempo constante, O(1). Aulas 02 e 03."],
  chave: ["🧩", "Chave de ordenação (chave composta)", "A regra do desempate: compara a 1ª peça; se empatar, a 2ª; se empatar de novo, a 3ª. É como a ordem do dicionário, que olha a 1ª letra, depois a 2ª…",
    "A auditoria arruma por zona eleitoral, depois por seção (a sala de votação) e depois pelo horário, para achar qualquer registro rápido.", "Chave composta = tupla comparada campo a campo (ordem lexicográfica). Código: jogo/registros.py → chave_composta."],
  comparacao: ["⚖️", "Comparação", "O computador olha duas fichas e decide qual vem antes. Cada comparação gasta um tiquinho de tempo e de energia.",
    "Com milhões de registros, escolher o método errado transforma minutos em horas de computador — e de eletricidade — na apuração.",
    "Mede-se o custo de um algoritmo contando operações em função de n (quantas fichas): análise assintótica, aulas 03 e 04. n² cresce muito mais rápido que n log n: com 500 fichas, 124 750 comparações contra cerca de 4 500."],
  bubble: ["🫧", "Bubble Sort (método da bolha)", "Compara vizinhos e troca os que estão fora de ordem; repete até não sobrar troca. As fichas grandes “sobem” como bolhas. Fácil, mas lento com muitas fichas.",
    "Como arrumar cartas na mão trocando duas de cada vez.", "Faz n(n−1)/2 comparações: O(n²). Aula 02 (versões iterativa e recursiva)."],
  merge: ["🔀", "Merge Sort (dividir e juntar)", "Divide o monte ao meio, de novo e de novo, até sobrar 1 ficha; depois junta os montinhos já em ordem. Sempre rápido.",
    "Como dividir a apuração entre várias equipes e depois juntar os resultados já organizados.", "Dividir e conquistar: T(n) = 2·T(n/2) + n, o que dá O(n log n). Aula 04."],
  quick: ["⚡", "Quick Sort (o pivô)", "Escolhe uma ficha como pivô e separa: menores de um lado, maiores do outro; repete em cada lado. Costuma ser o mais rápido.",
    "Como separar as cédulas em “antes” e “depois” de uma cédula de referência.", "Partição de Lomuto com o último elemento como pivô. Caso médio O(n log n); pior caso O(n²), com o vetor já ordenado. Aula 04."],
  fila: ["📥", "Esteira de chegada (fila)", "As provas chegam uma atrás da outra; só a da frente pode sair — como a fila da cantina.",
    "Os documentos chegam à central na ordem em que foram enviados.", "Fila = FIFO (primeiro a entrar, primeiro a sair). Inserir no fim e remover do início: O(1). Aula 06. É também a estrutura da BFS."],

function desenhaMapa(svg, opt) {
  const F = D.fase3, POS = {}; F.vertices.forEach(v => POS[v.id] = v);
  svg.innerHTML = ""; svg.setAttribute("viewBox", "-30 70 790 480"); svg.setAttribute("width", "100%");
  const cam = new Set(), ar = new Set(); (opt.caminho || []).forEach((v, k, a) => { cam.add(v); if (k) ar.add([a[k - 1], v].sort().join()); });
  F.arestas.forEach(([u, v]) => svgEl("line", {x1: POS[u].x, y1: POS[u].y, x2: POS[v].x, y2: POS[v].y, stroke: ar.has([u, v].sort().join()) ? "#ffb347" : "#6b5236", "stroke-width": ar.has([u, v].sort().join()) ? 7 : 4}, svg));
  // posição do nome de cada local; no mapa com custos, o nome de C vai para a esquerda para dar lugar ao custo de C-E
  const rot = v => opt.pesos && v.id === "C" ? [v.x - 38, v.y + 6, "end"] : [v.x, v.y + (v.id === "G" ? -40 : 50), "middle"];
  const caixas = []; F.vertices.forEach(v => { caixas.push([v.x, v.y, 34, 34]);           // círculo e rótulos de cada local
    const [lx, ly, al] = rot(v), hw = v.nome.length * 4.8 + 4; caixas.push([al === "end" ? lx - hw : lx, ly - 5, hw, 11]);
    if (v.pista || v.porta) caixas.push([v.x, v.y + 64, 58, 11]); });
  const livre = (x, y) => caixas.every(([cx, cy, hw, hh]) => Math.abs(x - cx) > hw + 15 || Math.abs(y - cy) > hh + 15);
  const lugar = (a, b) => { const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy), nx = -dy / L, ny = dx / L;   // procura um ponto da linha sem texto em cima
    for (const t of [.5, .42, .58, .34, .66]) for (const o of [0, 24, -24]) { const x = a.x + dx * t + nx * o, y = a.y + dy * t + ny * o; if (livre(x, y)) return [x, y]; }
    return [a.x + dx / 2 + nx * 24, a.y + dy / 2 + ny * 24]; };
  if (opt.pesos) F.arestas.forEach(([u, v]) => { const w = opt.pesos[u + "-" + v], [mx, my] = lugar(POS[u], POS[v]);
    svgEl("circle", {cx: mx, cy: my, r: 15, fill: w >= 5 ? "#b5321e" : "#15110c", stroke: "#ffb347", "stroke-width": 2}, svg);
    svgEl("text", {x: mx, y: my + 6, "text-anchor": "middle", "font-size": 17, "font-weight": 700, style: "fill:#fff6e4"}, svg, w); });
  const viz = new Set(opt.vizinhos || []);
  F.vertices.forEach(v => { const g = svgEl("g", {style: opt.clique ? "cursor:pointer" : ""}, svg);
    let f = "#2a1d12"; if (cam.has(v.id)) f = "#a9481a"; if (viz.has(v.id)) f = "#1f5f5b"; if (v.id === opt.atual) f = "#ffb347";
    if (v.id === opt.brilho) { const c = svgEl("circle", {cx: v.x, cy: v.y, r: 34, fill: "none", stroke: "#7CFC9A", "stroke-width": 5}, g);   // dica: o próximo local pulsa
      svgEl("animate", {attributeName: "r", values: "34;46;34", dur: "1.1s", repeatCount: "indefinite"}, c); }
    svgEl("circle", {cx: v.x, cy: v.y, r: 30, fill: f, stroke: viz.has(v.id) ? "#fff6e4" : "#ffb347", "stroke-width": viz.has(v.id) ? 4 : 2, "stroke-dasharray": viz.has(v.id) ? "6 4" : ""}, g);
    svgEl("text", {x: v.x, y: v.y + 9, "text-anchor": "middle", "font-size": 26, "font-weight": 700, style: v.id === opt.atual ? "fill:#15110c" : ""}, g, v.id);
    const [lx, ly, al] = rot(v); svgEl("text", {x: lx, y: ly, "text-anchor": al, "font-size": 15}, g, v.nome);
    if (v.pista || v.porta) svgEl("text", {x: v.x, y: v.y + 69, "text-anchor": "middle", "font-size": 15, style: "fill:#ff8a3d"}, g, v.pista ? "🔑 pista " + v.pista : "🔒 exige " + v.porta);
    if (opt.clique) g.onclick = () => opt.clique(v.id); });
  if (opt.atual) {        // o marcador da analista: sai de onde estava (opt.de) e desliza até o local atual
    const a = POS[opt.de || opt.atual], b = POS[opt.atual], t = p => `translate(${p.x + 24}px, ${p.y - 28}px)`;
    const g = svgEl("g", {style: `transform:${t(a)};transition:transform .45s ease;pointer-events:none`}, svg);
    svgEl("circle", {cx: 0, cy: 0, r: 17, fill: "#fff6e4", stroke: "#d9682b", "stroke-width": 3}, g);
    svgEl("text", {x: 0, y: 7, "text-anchor": "middle", "font-size": 19}, g, "🕵️");
    if (opt.de && opt.de !== opt.atual) requestAnimationFrame(() => requestAnimationFrame(() => g.style.transform = t(b)));
  }
}

function desenhaAVL(svg, raiz, destaque) {
  svg.innerHTML = ""; if (!raiz) { svg.setAttribute("viewBox", "0 0 300 50"); svg.setAttribute("width", 300); svgEl("text", {x: 10, y: 32}, svg, "(cofre vazio)"); return; }
  const nos = []; let x = 0; (function io(n, d) { if (!n) return; io(n.e, d + 1); nos.push({n, x: x++, d}); io(n.d, d + 1); })(raiz, 0);
  const DX = 64, DY = 70, W = nos.length * DX + 40, H = (Math.max(...nos.map(o => o.d)) + 1) * DY + 30;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("width", W); svg.style.maxWidth = "100%";
  const P2 = new Map(); nos.forEach(o => P2.set(o.n, {x: o.x * DX + 40, y: o.d * DY + 32}));
  nos.forEach(o => ["e", "d"].forEach(l => { if (o.n[l]) { const a = P2.get(o.n), b = P2.get(o.n[l]); svgEl("line", {x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: "#6b5236", "stroke-width": 3}, svg); } }));
  nos.forEach(o => { const p = P2.get(o.n);
    svgEl("circle", {cx: p.x, cy: p.y, r: 21, fill: o.n.k === destaque ? "#ffb347" : "#2a1d12", stroke: "#ffb347", "stroke-width": 2}, svg);
    svgEl("text", {x: p.x, y: p.y + 6, "text-anchor": "middle", "font-weight": 700, "font-size": 17, style: o.n.k === destaque ? "fill:#15110c" : ""}, svg, o.n.k);
    svgEl("text", {x: p.x, y: p.y + 36, "text-anchor": "middle", "font-size": 12}, svg, `FB ${o.n.fb > 0 ? "+" : ""}${o.n.fb}`); });
}

    carimbo("SELO 4", est, `${S.acertos} de ${F.lacres.length} palpites de giro certos; ${e} erro(s) nos pares. ${est === 3 ? "Memória impecável!" : "Três estrelas = 7 palpites certos e nenhum erro nos pares."}`, "f4"); } };
  $("#f4-buscar").onclick = () => { const k = Math.round(+$("#f4-cod").value), r = F.consultas[k], m = $("#f4-res");
    if (r === undefined || $("#f4-cod").value === "") { m.className = "msg nao"; m.textContent = "Digite um número de 0 a 100."; return; }
    m.className = "msg " + (r.achou ? "ok" : ""); m.textContent = `Caminho na árvore: ${r.caminho.join(" → ")}\n${r.achou ? "ENCONTRADO" : "NÃO está no cofre"} após ${r.comparacoes} comparação(ões). A árvore tem ${F.altura_final + 1} andares: nunca são precisas mais de ${F.altura_final + 1} comparações — numa lista sem ordem, poderiam ser todas as ${F.lacres.length}.`; };
  $("#f4-rein").onclick = () => { P.f4 = {k: 0, acertos: 0, palpites: [], pares: {}, errosPares: 0}; salvar(); ir("f4"); };
  sala1(); sala2(); mostra(sala);
};

/* ================= FASE 5 ================= */
TELAS.f5 = () => {
  const F = D.fase5;
  const agoraTxt = P.selos.slice(0, 4).every(Boolean) ? "Você resolveu as fases 1 a 4. Escolha um método: a auditoria vai conferir as SUAS jogadas."
    : `Ainda faltam selos (${P.selos.slice(0, 4).map((s, i) => s ? null : i + 1).filter(Boolean).join(", ")}). Pode rodar a auditoria mesmo assim: onde você não jogou, o solver resolve.`;
  $("#tela").innerHTML = `<div class="folha">${cabecalho(5)}
    <div class="agora"><b>O que fazer agora</b>${agoraTxt}</div>
    <h3>1. Escolha como a auditoria vai arrumar o lote</h3>
    <div class="decidir"><b class="rot">Para decidir — por que escolher?</b>Antes de conferir, a auditoria arruma de novo as 12 fichas. Os três jeitos chegam à <b>mesma ordem</b>; o que muda é o <b>trabalho</b> (quantas comparações). Com poucas fichas, qualquer um serve. Numa eleição de verdade, com milhões de registros, o jeito rápido economiza horas de computador e energia. Veja nos cartões quanto cada um gastaria com 500 fichas. ${termo("comparacao", "o que é comparação?")}</div>
    <div id="f5-metodos">${cartoesMetodos(null, k => { const l = D.fase1.comparacao.find(x => x[0] === 500 && x[1].toLowerCase().startsWith(k)); return l ? `Com 500 fichas: ${l[2].toLocaleString("pt-BR")} comparações (uma pessoa: ${tempoPessoa(l[2])})` : ""; })}</div>
    <h3>2. Assista à auditoria conferir tudo</h3>
    <p class="legenda" style="margin-top:0">Ela confere 3 coisas: as fichas da Fase 1, as provas da Fase 2 e o caminho da Fase 3. ✅ = a regra foi obedecida.</p>
    <div id="f5-rel"></div>
    <div class="barra">${voltar} <span class="legenda">Código: <span class="codigo">jogo/fase5.py</span></span></div></div>`;
  document.querySelectorAll("#f5-metodos [data-metodo]").forEach(b => b.onclick = () => { document.querySelectorAll("#f5-metodos [data-metodo]").forEach(x => x.classList.toggle("sel", x === b)); relatorio(b.dataset.metodo); });
  // Cada linha nasce apagada (.chk) e acende uma por uma: a auditoria "confere ao vivo".
  function etapa(nome, ok, origem, detalhe, checagens) {
    return `<div class="caixa"><b class="chk">${nome}</b>
      ${origem ? `<br><span class="legenda chk">Origem: ${origem}</span>` : ""}<br><span class="codigo chk">${detalhe}</span>
      ${checagens.map(([d, o]) => `<div class="chk" style="font-size:17px">${o ? "✅" : "❌"} ${d}</div>`).join("")}
      <div class="chk" style="font-family:var(--titulo);font-weight:800;font-size:19px;color:${ok ? "var(--verde)" : "var(--vermelho)"}">${ok ? "✔ CONSISTENTE" : "✘ NÃO CONSISTENTE"}</div></div>`; }
  function relatorio(alg) {
    const L = F.lotes[alg], e2 = D.fase2.estados[P.f2.atual], e3 = D.fase3.estados[P.f3.atual];
    const tri = P.selos[1] && e2.venceu ? etapa("Etapa 2 — As provas no cofre (Fase 2)", true, "suas jogadas (cada uma aceita pelas regras)", P.f2.acoes.join(" → "), [["custódia E2 → E4 → E1 → E6, fila e pilha vazias", true]])
      : etapa("Etapa 2 — As provas no cofre (Fase 2)", F.triagem_solver.ok, "solver (BFS)", F.triagem_solver.detalhe, F.triagem_solver.checagens);
    const mapa = P.selos[2] && e3.venceu ? etapa("Etapa 3 — O caminho no mapa (Fase 3)", true, "sua trilha (cada movimento aceito pelas regras)", P.f3.trilha.join(" → "), [["chegou ao Centro de Validação com AUT, sem violar portas", true]])
      : etapa("Etapa 3 — O caminho no mapa (Fase 3)", F.mapa_solver.ok, "solver (BFS)", F.mapa_solver.detalhe, F.mapa_solver.checagens);
    const ok = L.ok && F.triagem_solver.ok && F.mapa_solver.ok;
    const proprias = P.selos.slice(0, 4).every(Boolean), est = ok ? (proprias ? 3 : 2) : 0;
    P.selos[4] = ok; P.f5 = {feito: true, alg}; if (est) ganharEstrelas("f5", est); salvar();
    const todos = P.selos.every(Boolean);
    document.querySelectorAll("#f5-metodos [data-metodo]").forEach(b => b.disabled = true);
    $("#f5-rel").innerHTML = `<h3 style="margin-top:14px">Relatório de consistência <span class="legenda" id="f5-status">— conferindo…</span></h3>
      ${etapa("Etapa 1 — As fichas (Fase 1)", L.ok, "", L.detalhe, L.checagens)}<div class="chk" style="margin:-6px 0 10px">${traducao(+(L.detalhe.match(/(\d+) comparações/) || [0, 0])[1])}</div>${tri}${mapa}
      <details><summary>Comparação BFS × DFS em dois mapas (ordenada com Merge Sort)</summary><table class="metr"><tr><th>mapa</th><th>estratégia</th><th>ações</th><th>situações examinadas</th><th>repetidas barradas</th></tr>
        ${F.comparacao.map(x => `<tr><td>${x.cenario.split(" — ")[1]}</td><td>${x.estrategia}</td><td>${x.acoes ?? "-"}</td><td>${x.expandidos}</td><td>${x.repetidos}</td></tr>`).join("")}</table></details>
      <div id="f5-fim" style="display:none"><div class="msg ${ok ? "vitoria" : "nao"}">${ok ? "Trilha consistente. Selo 5 conquistado!" : "Trilha não consistente."}</div>
      ${todos ? `<div class="folha" style="background:#2a2414;color:#fff1cf;border:3px solid var(--ambar)"><div class="cofre" id="f5-cofre">🔒</div><h2 style="color:var(--ambar);text-align:center">Cofre de Verificação aberto</h2>${F.epilogo.map(p => `<p>${p}</p>`).join("")}</div>`
        : `<p>Para abrir o Cofre de Verificação, conquiste também o(s) selo(s): ${P.selos.map((s, i) => s ? null : i + 1).filter(Boolean).join(", ")}.</p>`}</div>`;
    const linhas = [...document.querySelectorAll("#f5-rel .chk")]; let k = 0;
    const acende = () => { if (k < linhas.length) { linhas[k].classList.add("on"); linhas[k].scrollIntoView({block: "nearest", behavior: "smooth"}); k++; setTimeout(acende, 330); return; }
      $("#f5-status").textContent = "— concluído"; $("#f5-fim").style.display = ""; document.querySelectorAll("#f5-metodos [data-metodo]").forEach(b => b.disabled = false);
      if (todos) setTimeout(() => { $("#f5-cofre").textContent = "🔓"; }, 700);
      $("#f5-fim").scrollIntoView({block: "start", behavior: "smooth"});
      if (ok) setTimeout(() => carimbo("SELO 5", est, `${proprias ? "A auditoria conferiu as SUAS jogadas nas fases 1 a 4." : "Onde você não jogou, o computador resolveu: três estrelas = jogar as fases 1 a 4 você mesma."}${todos ? " O Cofre de Verificação está aberto!" : ""}`, "f5"), todos ? 1400 : 300); };
    acende();
  }
};

/* ================= SOLVER ================= */
let solv = {prob: "mapa", alg: "BFS"};
TELAS.solver = () => {
  $("#tela").innerHTML = `<div class="folha"><h2>Resolver — o computador joga</h2>
    <p>O solver usa <b>as mesmas regras</b> do jogador. Cada situação do jogo é um vértice; cada ação válida, uma aresta. A <b>BFS</b> explora por camadas (fila); a <b>DFS</b>, em profundidade (pilha). A árvore AVL lembra as situações já vistas.</p>
    <h3>Desafio</h3><div class="escolha" id="sv-p"><button data-k="triagem">Fase 2 — Triagem</button><button data-k="mapa">Fase 3 — Mapa</button></div>
    <h3>Estratégia</h3><div class="escolha" id="sv-a"><button data-k="BFS">BFS (fila)</button><button data-k="DFS (recursiva)">DFS recursiva</button><button data-k="DFS (pilha)">DFS com pilha</button></div>
    <div id="sv-res"></div><div class="barra">${voltar} <button class="btn sec" onclick="ir('custos')">Mapa com custos: BFS × guloso × Dijkstra (aula 11) →</button> <span class="legenda">Código: <span class="codigo">algoritmos/solver.py</span></span></div></div>`;
  ["p", "a"].forEach(t => document.querySelectorAll(`#sv-${t} button`).forEach(b => { b.classList.toggle("sel", b.dataset.k === solv[t === "p" ? "prob" : "alg"]);
    b.onclick = () => { solv[t === "p" ? "prob" : "alg"] = b.dataset.k; TELAS.solver(); }; }));
  const r = D.solver[solv.prob][solv.alg], todos = D.solver[solv.prob];
  $("#sv-res").innerHTML = `<div class="caixa"><b>${r.encontrou ? `Solução com ${r.acoes} ações` : "Sem solução"}</b>
      <ol start="0" class="codigo" style="background:none">${r.caminho.map(([a, e]) => `<li><b>${a}</b> — ${e}</li>`).join("")}</ol></div>
    <table class="metr"><tr><th>estratégia</th><th></th><th>ações</th><th>examinadas</th><th>repetidas barradas (AVL)</th><th>fronteira máx.</th><th>tempo (ms)</th></tr>
      ${Object.entries(todos).map(([n, x]) => `<tr style="${n === solv.alg ? "font-weight:700" : ""}"><td>${n}</td><td></td><td>${x.acoes}</td><td>${x.expandidos}</td><td>${x.repetidos}</td><td>${x.fronteira}</td><td>${x.tempo_ms}</td></tr>`).join("")}</table>
    <p class="legenda">A BFS garante o menor número de ações porque cada ação custa 1. A DFS não tem essa garantia.</p>
    <details><summary>Árvore de busca (cada caixa é uma situação examinada; em laranja, o caminho da solução)</summary><div class="crt" style="overflow-x:auto"><svg id="sv-arv"></svg></div></details>`;
  const a = r.arvore, svg = $("#sv-arv"), DX = solv.prob === "mapa" ? 136 : 250, DY = 70, M = DX / 2 + 10;
  const W = (Math.max(...a.nos.map(n => n.x)) + 1) * DX + M, H = (Math.max(...a.nos.map(n => n.y)) + 1) * DY + 40;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("width", W); const Q = {}; a.nos.forEach(n => Q[n.id] = {x: n.x * DX + M, y: n.y * DY + 28, n});
  a.arestas.forEach(([p, f]) => svgEl("line", {x1: Q[p].x, y1: Q[p].y, x2: Q[f].x, y2: Q[f].y, stroke: Q[p].n.caminho && Q[f].n.caminho ? "#d9682b" : "#6b5236", "stroke-width": 2}, svg));
  a.nos.forEach(n => { const p = Q[n.id]; svgEl("rect", {x: p.x - DX / 2 + 6, y: p.y - 13, width: DX - 12, height: 26, rx: 5, fill: n.caminho ? "#d9682b" : "#2a1d12", stroke: "#ffb347"}, svg);
    svgEl("text", {x: p.x, y: p.y + 5, "text-anchor": "middle", "font-size": 12, style: n.caminho ? "fill:#15110c;font-weight:700" : ""}, svg, n.rotulo); });
};

/* ================= AJUDA e RESULTADOS ================= */
TELAS.ajuda = () => {
  $("#tela").innerHTML = `<div class="folha"><h2>Como jogar</h2>
    <p><b>Tudo é clicável.</b> Em cada fase há uma faixa laranja <b>“O que fazer agora”</b> e um botão <b>💡 Dica</b>. Jogadas erradas são recusadas com explicação e não estragam nada. <b>Desfazer</b> volta um passo.</p>
    <p><b>Objetivo:</b> ganhar os 5 selos (no alto da tela) e abrir o Cofre de Verificação.</p>
    <p><b>Estrelas:</b> cada fase dá de 1 a 3. Três estrelas = jogar como o computador: o mínimo de ações que a BFS acha (Fases 2 e 3), a menor energia que o Dijkstra acha (desafio extra), a chave certa de primeira (Fase 1), bons palpites (Fase 4) e todas as fases jogadas por você (Fase 5). Em cada fase, o botão ❔ Como jogar repete as instruções.</p>
    <table class="metr"><tr><th>Fase</th><th>Como vencer</th></tr>
      <tr><td>1. Arquivo Embaralhado</td><td>Montar a chave zona → seção → horário e ordenar com qualquer método</td></tr>
      <tr><td>2. Central de Triagem</td><td>Montar a custódia E2 → E4 → E1 → E6 (Guardar, Aceitar, Arquivar, Aceitar, Liberar, Arquivar, Aceitar)</td></tr>
      <tr><td>3. Mapa das Seções</td><td>Pegar SEQ em E e AUT em D antes de entrar em F (A → C → E → C → B → H → D → F)</td></tr>
      <tr><td>4. Cofre dos Estados</td><td>Dar palpite nos 9 lacres e acertar os 4 pares</td></tr>
      <tr><td>5. Auditoria Final</td><td>Escolher um método e ler o relatório</td></tr>
      <tr><td>Desafio extra (aula 11)</td><td>Chegar a F gastando a menor energia: 11 (A → B → C → E → C → B → H → D → F). Não dá selo.</td></tr></table>
    <p class="legenda" style="margin-top:12px">Como esta página funciona: o Python executou as regras reais do jogo e calculou todas as situações possíveis de cada fase, o resultado de cada jogada e a dica do solver (BFS) para cada situação. A página só consulta essas tabelas: as regras estão no código em <span class="codigo">jogo/</span>, não aqui. O progresso fica guardado neste navegador.</p>
    ${voltar}</div>`;
};
TELAS.resultados = () => {
  $("#tela").innerHTML = `<div class="folha"><h2>Resultados</h2>
    <p>Estrelas: ${["f1", "f2", "f3", "f4", "f5", "custos"].map(k => `${k === "custos" ? "desafio extra" : "Fase " + k[1]} ${pintaEstrelas(P.estrelas[k]) || "—"}`).join(" · ")}</p>
    <div class="caixa"><h3>Fase 1 — tentativas</h3>${P.f1.tentativas.length ? P.f1.tentativas.map(t => `${t[0]} por ${t[1]}: ${t[2]} comparações → ${t[3] ? "ACEITO" : "recusado"}`).join("<br>") : "(nenhuma)"}</div>
    <div class="caixa"><h3>Fase 2 — ações</h3>${P.f2.acoes.join(" → ") || "(nenhuma)"}</div>
    <div class="caixa"><h3>Fase 3 — trilha</h3>${P.f3.trilha.join(" → ")} (energia restante: ${D.fase3.estados[P.f3.atual].energia})</div>
    <div class="caixa"><h3>Fase 4 — cofre</h3>${P.f4.k}/${D.fase4.lacres.length} lacres, ${P.f4.acertos} palpites certos; ${Object.values(P.f4.pares).filter(x => x === true).length}/${D.fase4.pares.length} pares certos</div>
    <div class="caixa"><h3>Fase 5 — auditoria</h3>${P.f5.feito ? (P.selos[4] ? "consistente" : "não consistente") : "não executada"}</div>
    <div class="caixa"><h3>Desafio extra — mapa com custos</h3>${P.mc.melhor === null ? "ainda não chegou a F" : `menor energia gasta: ${P.mc.melhor} (o Dijkstra gasta ${D.custos.otimo})`}</div>
    ${voltar}</div>`;
};

desenharSelos(); marcarSom(); ir("menu");
</script>
