<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">

<title>Urna Lógica — Jogo</title>
<style>
  :root {
    --parede: #2e1d11; --painel: #3a2516; --papel: #f6ead0; --papel2: #fbf3df; --tinta: #2b1d12; --tinta2: #6b5236;

  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--parede); color: var(--tinta); font: 20px/1.55 "Segoe UI", system-ui, sans-serif; }
  header.topo { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
                background: #1d120a; color: var(--papel); padding: 10px 18px; border-bottom: 4px solid var(--laranja); }
  header.topo .marca { font-family: var(--titulo); letter-spacing: .1em; text-transform: uppercase; font-size: 14px; font-weight: 700; }
  .selos { display: flex; gap: 8px; margin-left: auto; }

  header.topo .faixa b { color: var(--ambar); }
  .pearl .av svg { display: block; }
  .historia { text-align: left; max-width: 820px; margin: 0 auto; }
  .historia .elenco { display: flex; gap: 22px; justify-content: center; align-items: flex-end; margin: 6px 0 14px; }
  .historia .elenco figure { margin: 0; text-align: center; font-size: 14px; color: var(--tinta2); max-width: 180px; }
  .historia .bloco { border-left: 6px solid var(--laranja); background: #fbf3df; border-radius: 8px; padding: 10px 14px; margin: 10px 0; }
  .historia .bloco > b:first-child { display: block; font: 800 14px var(--titulo); letter-spacing: .06em; text-transform: uppercase; color: var(--laranja2); }
  .historia .bloco.civ { border-color: var(--petroleo); } .historia .bloco.civ > b:first-child { color: var(--petroleo2); }
  .historia .problemas { counter-reset: p; list-style: none; padding: 0; margin: 6px 0 0; }

  .historia .problemas li::before { content: counter(p); flex: none; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
     background: var(--laranja); color: #fff6e4; font: 700 15px var(--titulo); }
  .passos-capa { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 14px; font-size: 14px; color: var(--tinta2); }
  .passos-capa span { padding: 3px 12px; border-radius: 12px; background: #efe3c4; } .passos-capa span.ativo { background: var(--laranja); color: #fff6e4; }
  .cena { display: flex; gap: 22px; align-items: center; justify-content: center; max-width: 900px; margin: 10px auto 0; text-align: left; min-height: 260px; }
  .cena .ator { flex: none; text-align: center; font: 700 16px var(--titulo); color: var(--tinta2); } .cena .ator svg { display: block; margin: 0 auto 4px; }
  .balao-cena { position: relative; background: #fffaf0; border: 3px solid var(--tinta2); border-radius: 18px; padding: 18px 22px; font-size: 23px; line-height: 1.5; box-shadow: 0 6px 0 #d8c59c; }
  .balao-cena::before { content: ""; position: absolute; left: -16px; top: 50%; margin-top: -12px; border: 12px solid transparent; border-right: 16px solid var(--tinta2); border-left: 0; }
  .tit-cena { font: 800 18px var(--titulo); letter-spacing: .06em; text-transform: uppercase; color: var(--laranja2); margin-bottom: 6px; }
  .selos-capa { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 12px; font-size: 15px; text-align: center; line-height: 1.25; }
  .selos-capa .disco { display: grid; place-items: center; width: 52px; height: 52px; margin: 0 auto 4px; border-radius: 50%; font-size: 26px;
     background: radial-gradient(circle at 35% 35%, #f19a5c, var(--laranja2)); border: 3px solid #7a3510; }
  .nav-cena { display: flex; gap: 14px; align-items: center; justify-content: center; margin-top: 22px; }
  .nav-cena .pontos { display: flex; gap: 8px; } .nav-cena .pontos i { width: 12px; height: 12px; border-radius: 50%; background: #d8c59c; } .nav-cena .pontos i.on { background: var(--laranja); }
  .dicas-capa { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; max-width: 980px; margin: 16px auto; text-align: left; }
  .dicas-capa > div { background: #fbf3df; border: 3px solid var(--borda); border-radius: 14px; padding: 14px 16px; font-size: 18px; }
  .dicas-capa .ic { display: block; font-size: 38px; } .dicas-capa b { display: block; font: 800 20px var(--titulo); margin: 4px 0; }
  @media (max-width: 700px) { .cena { flex-direction: column; } .balao-cena::before { display: none; } .selos-capa { grid-template-columns: repeat(3, 1fr); } }
  .palanque { margin: 4px auto 0; width: 120px; background: var(--laranja2); color: #fff6e4; font: 800 14px var(--titulo); letter-spacing: .1em; padding: 6px 0; border-radius: 4px 4px 0 0; }

  .licoes { display: grid; gap: 6px; margin-top: 10px; font-size: 18px; line-height: 1.35; }

  @keyframes cai { to { transform: translateY(110vh) rotate(720deg); } }
  @media (prefers-reduced-motion: reduce) { .confete { display: none; } }
  .comojogar { text-align: left; max-width: 720px; margin: 0 auto 16px; font-size: 19px; } .comojogar li { margin: 8px 0; }
  .gloss .camada-t.eleicao { color: var(--petroleo2); }
  .selo { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-family: var(--titulo); font-weight: 700;
          background: #4a3a2a; color: #9c8a73; border: 2px solid #6b5236; font-size: 15px; }
  .selo.ok { background: radial-gradient(circle at 35% 35%, #f19a5c, var(--laranja2)); color: #fff6e4; border-color: var(--ambar); box-shadow: 0 0 10px rgba(255,179,71,.5); }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
  .folha { background: var(--papel); border-radius: 8px; padding: 22px 26px; box-shadow: 0 8px 0 #1d120a; margin-bottom: 18px; }
  h1, h2, h3 { font-family: var(--titulo); margin: 0 0 10px; }
  h1 { font-size: 28px; } h2 { font-size: 22px; } h3 { font-size: 17px; text-transform: uppercase; letter-spacing: .06em; color: var(--tinta2); }
  p { margin: 0 0 10px; }
  .agora { background: #fff3d6; border: 3px solid var(--laranja); border-radius: 10px; padding: 12px 16px; margin: 12px 0; font-size: 20px; }
  .agora b { font-family: var(--titulo); letter-spacing: .06em; color: var(--laranja2); display: block; font-size: 13px; text-transform: uppercase; }
  .msg { border-radius: 8px; padding: 12px 16px; margin: 12px 0; font-size: 18px; white-space: pre-line; border: 2px solid var(--tinta2); background: var(--papel2); min-height: 50px; }
  .msg.ok { border-color: var(--verde); background: #e3f1e5; } .msg.nao { border-color: var(--vermelho); background: #f8e1da; }

  button { font: inherit; cursor: pointer; }
  .btn { font-family: var(--titulo); font-size: 18px; font-weight: 700; letter-spacing: .03em;
         background: var(--laranja); color: #fff8ec; border: 0; border-bottom: 5px solid var(--laranja2);
         border-radius: 10px; padding: 12px 18px; margin: 4px 6px 4px 0; min-height: 50px; }
  .btn:hover { filter: brightness(1.07); } .btn:active { transform: translateY(2px); border-bottom-width: 3px; }
  .btn.sec { background: var(--petroleo); border-bottom-color: var(--petroleo2); }

  .btn.grande { font-size: 20px; padding: 16px 22px; min-width: 220px; }

  .grade .cartao p.legenda { flex: 1; }

  .dois { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; }
  @media (max-width: 820px) { .dois { grid-template-columns: 1fr; } .folha { padding: 18px 16px; } }
  .caixa { background: var(--papel2); border: 2px dashed var(--borda); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }

  table.reg { border-collapse: collapse; width: 100%; font-family: var(--maquina); font-size: 16px; }

  table.reg td { padding: 5px 6px; border-bottom: 1px dotted var(--borda); }
  table.reg tr.erro td { background: #f6c5b8; }
  .escolha { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 12px; }

  .crt { background: var(--crt); border: 8px solid #5b4632; border-radius: 12px; padding: 8px; }

  .legenda { font-size: 16px; color: var(--tinta2); }

  .doc { font-family: var(--maquina); background: var(--papel2); border-left: 5px solid var(--laranja); padding: 10px 14px; white-space: pre-line; font-size: 15px; }
  .barra { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 10px; padding-top: 10px; border-top: 2px dotted var(--borda); }
  .codigo { font-family: var(--maquina); font-size: 14px; background: #efe3c4; border-radius: 4px; padding: 1px 6px; }
  table.metr { border-collapse: collapse; width: 100%; font-size: 16px; }

  table.metr th:first-child, table.metr td:first-child, table.metr th:nth-child(2), table.metr td:nth-child(2) { text-align: left; }
  /* ---------- abertura, tutorial, carimbo, estrelas ---------- */
  .capa { text-align: center; padding: 34px 26px; }
  .capa h1 { font-size: 34px; } .capa .linhas { font-size: 21px; line-height: 1.7; margin: 18px auto 24px; max-width: 640px; }
  .capa .linhas div::before { content: "▸ "; color: var(--laranja); }
  .veu { position: fixed; inset: 0; background: rgba(21,17,12,.72); z-index: 20; display: grid; place-items: center; padding: 16px; animation: aparece .2s; }
  .tut { background: var(--papel); border: 4px solid var(--laranja); border-radius: 14px; max-width: 600px; width: 100%; max-height: 88vh; overflow-y: auto; padding: 22px 24px; box-shadow: 0 10px 0 #1d120a; }
  .tut h2 { margin-bottom: 4px; } .tut .rotulo { font-family: var(--titulo); color: var(--laranja2); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }

  .carimbo { width: 250px; height: 250px; border-radius: 50%; border: 10px double #fff1cf; background: radial-gradient(circle at 35% 30%, #f19a5c, var(--laranja2));

  .som { margin-left: 8px; background: none; border: 2px solid #6b5236; color: var(--papel); border-radius: 8px; padding: 4px 10px; font-size: 14px; }
  /* ---------- Fase 1: chave e lote animado ---------- */

<script>

// proxima = [tela, rótulo]: o carimbo já oferece o botão para seguir (pedido: não obrigar a voltar ao menu).

/* ================= DICIONÁRIO DO JOGO =================

const GLOSS = {

    "",
    "Mede-se o custo de um algoritmo contando operações em função de n (quantas fichas): análise assintótica, aulas 03 e 04. n² cresce muito mais rápido que n log n: com 500 fichas, 124 750 comparações contra cerca de 4 500."],
  bubble: ["🫧", "Bubble Sort (método da bolha)", "Compara vizinhos e troca os que estão fora de ordem. Repete a passada n−1 vezes: a cada passada, a maior ficha ainda solta vai para o fim, como uma bolha que sobe. Fácil, mas lento com muitas fichas.<br><b>Exemplo:</b> 3 1 2 → compara 3 e 1, troca → 1 3 2 → compara 3 e 2, troca → <b>1 2 3</b> → 2ª passada: compara 1 e 2, não troca.",

  quick: ["⚡", "Quick Sort (o pivô)", "Escolhe uma ficha como pivô e separa: menores de um lado, maiores do outro; repete em cada lado. Costuma ser o mais rápido.<br><b>Exemplo:</b> 4 1 3 2 com pivô 2 → menores: [1]; maiores: [4 3] → arruma cada lado → <b>1 2 3 4</b>.",
    "", "Partição de Lomuto com o último elemento como pivô. Caso médio O(n log n); pior caso O(n²), com o vetor já ordenado ou invertido, ou com muitas chaves iguais. Aula 04."],
  fila: ["📥", "Esteira de chegada (fila)", "A esteira da Fase 2: as provas chegam uma atrás da outra e só a da frente pode sair. Quem chegou primeiro sai primeiro.",
    "", "Fila = FIFO (primeiro a entrar, primeiro a sair). Inserir no fim e remover do início: O(1). Aula 06. É também a estrutura da BFS."],

    "", "Pilha = LIFO (último a entrar, primeiro a sair). Empilhar e desempilhar no topo: O(1). Aula 06. O botão Desfazer e a DFS usam pilha."],

let f1sel = { alg: null, chave: [] };
TELAS.f1 = () => {
  const F = D.fase1, NOME = Object.fromEntries(F.campos), ALG = Object.fromEntries(F.algoritmos);
  let tentativas = 0, animando = false;
  $("#tela").innerHTML = `<div class="folha">${cabecalho(1)}
    <div class="agora" id="f1-agora"></div>
    <div class="caixa"><h3>A regra da auditoria</h3>${F.enigma.replace(/\n/g, " ")}
      ${dicaClique("Por que essa ordem? Não é regra aleatória", "Os números de seção <b>se repetem em zonas diferentes</b>: neste lote há uma seção 001 na zona 02 e outra na zona 03. Ordenar só pela seção misturaria salas de lugares diferentes — por isso a <b>zona vem primeiro</b>. Dentro de cada seção, o <b>horário</b> mostra a sequência do que aconteceu naquela urna. Assim a auditoria confere uma sala de cada vez, do começo ao fim, e percebe na hora se falta ou sobra um registro.")}</div>
    <div class="passo"><span class="num">1</span><div><b>Monte a regra de arrumação</b> ${termo("chave", "o que é uma chave?")}
      <div class="legenda">Clique nas peças na ordem em que a regra compara: a 1ª decide; a 2ª só desempata.</div></div></div>
    <div id="f1-slots"></div>
    <div class="escolha pecas" id="f1-pecas">${F.campos.map(([k, n]) => `<button data-c="${k}">${n}</button>`).join("")}<button class="neutro" id="f1-limpa" style="background:#e6d6b2">↺ limpar</button></div>
    ${dicaClique("Como funciona a chave?", "Como no dicionário: primeiro a 1ª letra, depois a 2ª… Se ainda empatar, o número da ficha (identificador) desempata no fim.")}
    <div class="passo"><span class="num">2</span><div><b>Escolha um jeito de arrumar</b>
      ${dicaClique("Qual escolher?", `Os três chegam à <b>mesma ordem</b>. O que muda é o <b>trabalho</b>: quantas vezes o computador compara duas fichas ${termo("comparacao", "comparação")}. Com 12 fichas, tanto faz; com milhares, a diferença vira horas.`)}</div></div>
    <div id="f1-alg">${cartoesMetodos(f1sel.alg)}</div>
    <div class="passo"><span class="num">3</span><div><b>Ordene e veja a auditoria conferir</b></div></div>
    <button class="btn grande" id="f1-ord">▶ Ordenar o lote</button> <button class="btn sec" id="f1-dica">💡 Dica</button>
    <div><span class="placar" id="f1-placar">comparações 0 · movimentações 0</span> <span id="f1-trad"></span></div>
    <div class="msg" id="f1-msg">Monte a chave, escolha um método e clique em Ordenar.</div>
    <h3>As 12 fichas ${termo("vetor", "lote = vetor")}</h3><div class="lote" id="f1-lote"></div>
    <details open><summary>E se fossem 500 fichas? Compare o trabalho dos três jeitos</summary><table class="metr"><tr><th>fichas</th><th>jeito</th><th>comparações</th><th>uma pessoa, a 1 s por comparação</th></tr>
      ${F.comparacao.map(l => `<tr><td>${l[0]}</td><td>${l[1]}</td><td>${l[2].toLocaleString("pt-BR")}</td><td>${tempoPessoa(l[2])}</td></tr>`).join("")}</table>
      <p class="legenda">Com 500 fichas, o Bubble faz quase 28 vezes mais comparações que o Merge: mais tempo de computador, mais energia elétrica, apuração mais demorada.
      ${termo("comparacao", "Por que isso acontece?")}</p></details>
    <div class="barra">${voltar} <span class="legenda">Código: <span class="codigo">algoritmos/ordenacao.py</span> · <span class="codigo">jogo/fase1.py</span> · <span class="codigo">jogo/registros.py</span> (chave_composta)</span></div></div>`;
  // ---- o lote: cada ficha é uma linha posicionada; mudar a posição faz a linha deslizar
  const ALT = 32, lote = $("#f1-lote");
  lote.style.height = (F.registros.length * ALT + 34) + "px";
  lote.innerHTML = `<div class="linha cab"><span>gaveta</span><span>ficha</span><span>zona eleitoral</span><span>seção (sala)</span><span>voto (opção)</span><span>horário</span><span>situação</span></div>` +
    F.registros.map((r, k) => `<div class="linha" data-r="${k}">${["", ...r].map(c => `<span>${c}</span>`).join("")}</div>`).join("");
  const linhas = [...lote.querySelectorAll("[data-r]")];
  const posicionar = (ordem, mexeu, erro) => ordem.forEach((k, pos) => { const el = linhas[k];
    el.style.top = (34 + pos * ALT) + "px"; el.firstChild.textContent = pos;
    el.classList.toggle("mexeu", !!mexeu && mexeu.has(k)); el.classList.toggle("erro", erro >= 0 && (pos === erro || pos === erro + 1)); });
  const decodifica = q => [...q].map(c => parseInt(c, 36));
  posicionar(F.registros.map((_, k) => k));
  // ---- montar a chave
  const desenhaChave = () => {
    const n = Math.max(3, f1sel.chave.length + (f1sel.chave.length < 4 ? 1 : 0));
    $("#f1-slots").innerHTML = Array.from({length: n}, (_, i) => f1sel.chave[i]
      ? `<span class="slot cheio" data-i="${i}" title="clique para tirar"><span class="n">${i + 1}º</span>${NOME[f1sel.chave[i]]} ✕</span>`
      : `<span class="slot"><span class="n">${i + 1}º</span>?</span>`).join("");
    document.querySelectorAll("#f1-pecas [data-c]").forEach(b => b.disabled = f1sel.chave.includes(b.dataset.c));
    document.querySelectorAll("#f1-slots [data-i]").forEach(e => e.onclick = () => { if (animando) return; f1sel.chave.splice(+e.dataset.i, 1); desenhaChave(); agora(); });
  };
  document.querySelectorAll("#f1-pecas [data-c]").forEach(b => b.onclick = () => { if (animando || f1sel.chave.length >= 4) return; f1sel.chave.push(b.dataset.c); desenhaChave(); agora(); });
  $("#f1-limpa").onclick = () => { if (animando) return; f1sel.chave = []; desenhaChave(); agora(); };
  document.querySelectorAll("#f1-alg [data-metodo]").forEach(b => {
    b.onclick = () => { if (animando) return; f1sel.alg = b.dataset.metodo; document.querySelectorAll("#f1-alg [data-metodo]").forEach(x => x.classList.toggle("sel", x === b)); agora(); }; });
  const agora = () => $("#f1-agora").innerHTML = "<b>O que fazer agora</b>" + (P.selos[0] && !tentativas ? `Selo já conquistado. Jogue de novo para tentar 3 estrelas, ou siga em frente.<br>${botaoProxima("f1")}` :
    !f1sel.chave.length ? "Clique na peça que a regra compara PRIMEIRO (leia a regra da auditoria)." : !f1sel.alg ? "Agora escolha um jeito de arrumar: leia os três cartões (qualquer um serve)." : "Clique em “Ordenar o lote” e veja as fichas se moverem.");
  // ---- ordenar: o resultado vem pronto do Python; a página só anima os quadros
  $("#f1-ord").onclick = () => {
    const m = $("#f1-msg");
    if (animando) return;
    if (!f1sel.chave.length || !f1sel.alg) { m.className = "msg nao"; m.textContent = "Monte a chave e escolha o método primeiro."; return; }
    const r = F.chaves[f1sel.alg + "|" + f1sel.chave.join(">")]; tentativas++; animando = true;
    $("#f1-placar").scrollIntoView({behavior: "smooth", block: "start"});        // traz o lote para a tela antes de animar
    m.className = "msg"; m.textContent = `${ALG[f1sel.alg]} ordenando pela chave (${f1sel.chave.map(c => NOME[c]).join(", ")})…`;
    const Q = r.quadros, dt = Math.max(90, Math.min(260, 5000 / Q.length)); let k = 0, ant = decodifica(Q[0]);
    posicionar(F.registros.map((_, i) => i));
    const passo = () => {
      if (k < Q.length) { const atual = decodifica(Q[k]), mexeu = new Set(atual.filter((x, i) => ant[i] !== x)); posicionar(atual, mexeu); ant = atual;
        const fr = Q.length > 1 ? k / (Q.length - 1) : 1;
        $("#f1-placar").textContent = `comparações ${Math.round(r.comparacoes * fr)} · movimentações ${Math.round(r.movimentacoes * fr)}`; k++; setTimeout(passo, dt); return; }
      animando = false; posicionar(ant, null, r.erro);
      $("#f1-placar").textContent = `comparações ${r.comparacoes} · movimentações ${r.movimentacoes}`;
      $("#f1-trad").innerHTML = traducao(r.comparacoes);
      P.f1.tentativas.push([ALG[f1sel.alg], f1sel.chave.map(c => NOME[c]).join(" > "), r.comparacoes, r.aceito]);
      m.className = "msg " + (r.aceito ? "vitoria" : "nao");
      m.textContent = `${ALG[f1sel.alg]}: ${r.comparacoes} comparações, ${r.movimentacoes} movimentações.\n${r.mensagem}`;
      if (r.aceito) { const est = tentativas === 1 ? 3 : tentativas <= 3 ? 2 : 1; P.selos[0] = true; ganharEstrelas("f1", est);
        carimbo("SELO 1", est, `Lote aceito na ${tentativas}ª tentativa. ${est === 3 ? "De primeira!" : "Três estrelas = acertar a regra de primeira."}`, "f1"); }
      salvar(); agora();
    };
    passo();
  };
  $("#f1-dica").onclick = () => { const m = $("#f1-msg"); m.className = "msg dica";
    m.textContent = !f1sel.chave.length ? "Leia a regra: qual campo ela compara primeiro? Essa é a 1ª peça." :
      f1sel.chave[0] !== "zona" ? "A regra começa pela ZONA: ela deve ser a 1ª peça. Clique na peça para tirá-la ou use ↺ limpar." :
      f1sel.chave[1] && f1sel.chave[1] !== "secao" ? "Depois da zona, a regra olha a SEÇÃO." :
      f1sel.chave[2] && f1sel.chave[2] !== "horario" ? "Empatou na zona e na seção? Aí vale o HORÁRIO." :
      f1sel.chave.length < 3 ? "Continue: a regra tem três peças, na ordem zona → seção → horário." : "A chave está certa. Qualquer método serve: o que muda é o trabalho (comparações)."; };
  desenhaChave(); agora();

function desenhaMapa(svg, opt) {
  const F = D.fase3, POS = {}; F.vertices.forEach(v => POS[v.id] = v);
  svg.innerHTML = ""; svg.setAttribute("viewBox", "-30 70 790 480"); svg.setAttribute("width", "100%");
  const cam = new Set(), ar = new Set(); (opt.caminho || []).forEach((v, k, a) => { cam.add(v); if (k) ar.add([a[k - 1], v].sort().join()); });
  F.arestas.forEach(([u, v]) => svgEl("line", {x1: POS[u].x, y1: POS[u].y, x2: POS[v].x, y2: POS[v].y, stroke: ar.has([u, v].sort().join()) ? "#ffb347" : "#6b5236", "stroke-width": ar.has([u, v].sort().join()) ? 7 : 4}, svg));
  // posição do nome de cada local; no mapa com custos, o nome de C vai para a esquerda para dar lugar ao custo de C-E
  const rot = v => opt.pesos && v.id === "C" ? [v.x - 38, v.y + 6, "end"] : [v.x, v.y + (v.id === "G" ? -40 : 50), "middle"];
  const caixas = []; F.vertices.forEach(v => { caixas.push([v.x, v.y, 34, 34]);           // círculo e rótulos de cada local
    const [lx, ly, al] = rot(v), hw = v.nome.length * 4.8 + 4; caixas.push([al === "end" ? lx - hw : lx, ly - 5, hw, 11]);
    if (v.pista || v.porta) caixas.push([v.x, v.y + 64, 58, 11]); });
  const livre = (x, y) => caixas.every(([cx, cy, hw, hh]) => Math.abs(x - cx) > hw + 15 || Math.abs(y - cy) > hh + 15);
  const lugar = (a, b) => { const dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy), nx = -dy / L, ny = dx / L;   // procura um ponto da linha sem texto em cima
    for (const t of [.5, .42, .58, .34, .66]) for (const o of [0, 24, -24]) { const x = a.x + dx * t + nx * o, y = a.y + dy * t + ny * o; if (livre(x, y)) return [x, y]; }
    return [a.x + dx / 2 + nx * 24, a.y + dy / 2 + ny * 24]; };
  if (opt.pesos) F.arestas.forEach(([u, v]) => { const w = opt.pesos[u + "-" + v], [mx, my] = lugar(POS[u], POS[v]);
    svgEl("circle", {cx: mx, cy: my, r: 15, fill: w >= 5 ? "#b5321e" : "#15110c", stroke: "#ffb347", "stroke-width": 2}, svg);
    svgEl("text", {x: mx, y: my + 6, "text-anchor": "middle", "font-size": 17, "font-weight": 700, style: "fill:#fff6e4"}, svg, w); });
  const viz = new Set(opt.vizinhos || []);
  F.vertices.forEach(v => { const g = svgEl("g", {style: opt.clique ? "cursor:pointer" : ""}, svg);
    let f = "#2a1d12"; if (cam.has(v.id)) f = "#a9481a"; if (viz.has(v.id)) f = "#1f5f5b"; if (v.id === opt.atual) f = "#ffb347";
    if (v.id === opt.brilho) { const c = svgEl("circle", {cx: v.x, cy: v.y, r: 34, fill: "none", stroke: "#7CFC9A", "stroke-width": 5}, g);   // dica: o próximo local pulsa
      svgEl("animate", {attributeName: "r", values: "34;46;34", dur: "1.1s", repeatCount: "indefinite"}, c); }
    svgEl("circle", {cx: v.x, cy: v.y, r: 30, fill: f, stroke: viz.has(v.id) ? "#fff6e4" : "#ffb347", "stroke-width": viz.has(v.id) ? 4 : 2, "stroke-dasharray": viz.has(v.id) ? "6 4" : ""}, g);
    svgEl("text", {x: v.x, y: v.y + 9, "text-anchor": "middle", "font-size": 26, "font-weight": 700, style: v.id === opt.atual ? "fill:#15110c" : ""}, g, v.id);
    const [lx, ly, al] = rot(v); svgEl("text", {x: lx, y: ly, "text-anchor": al, "font-size": 15}, g, v.nome);
    if (v.pista || v.porta) svgEl("text", {x: v.x, y: v.y + 69, "text-anchor": "middle", "font-size": 15, style: "fill:#ff8a3d"}, g, v.pista ? "🔑 pista " + v.pista : "🔒 exige " + v.porta);
    if (opt.clique) g.onclick = () => opt.clique(v.id); });
  if (opt.atual) {        // o marcador da analista: sai de onde estava (opt.de) e desliza até o local atual
    const a = POS[opt.de || opt.atual], b = POS[opt.atual], t = p => `translate(${p.x + 24}px, ${p.y - 28}px)`;
    const g = svgEl("g", {style: `transform:${t(a)};transition:transform .45s ease;pointer-events:none`}, svg);
    svgEl("circle", {cx: 0, cy: 0, r: 17, fill: "#fff6e4", stroke: "#d9682b", "stroke-width": 3}, g);
    svgEl("text", {x: 0, y: 7, "text-anchor": "middle", "font-size": 19}, g, "🕵️");
    if (opt.de && opt.de !== opt.atual) requestAnimationFrame(() => requestAnimationFrame(() => g.style.transform = t(b)));
  }
}

function desenhaAVL(svg, raiz, destaque) {
  svg.innerHTML = ""; if (!raiz) { svg.setAttribute("viewBox", "0 0 300 50"); svg.setAttribute("width", 300); svgEl("text", {x: 10, y: 32}, svg, "(cofre vazio)"); return; }
  const nos = []; let x = 0; (function io(n, d) { if (!n) return; io(n.e, d + 1); nos.push({n, x: x++, d}); io(n.d, d + 1); })(raiz, 0);
  const DX = 64, DY = 70, W = nos.length * DX + 40, H = (Math.max(...nos.map(o => o.d)) + 1) * DY + 30;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("width", W); svg.style.maxWidth = "100%";
  const P2 = new Map(); nos.forEach(o => P2.set(o.n, {x: o.x * DX + 40, y: o.d * DY + 32}));
  nos.forEach(o => ["e", "d"].forEach(l => { if (o.n[l]) { const a = P2.get(o.n), b = P2.get(o.n[l]); svgEl("line", {x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: "#6b5236", "stroke-width": 3}, svg); } }));
  nos.forEach(o => { const p = P2.get(o.n);
    svgEl("circle", {cx: p.x, cy: p.y, r: 21, fill: o.n.k === destaque ? "#ffb347" : "#2a1d12", stroke: "#ffb347", "stroke-width": 2}, svg);

    svgEl("text", {x: p.x, y: p.y + 36, "text-anchor": "middle", "font-size": 12}, svg, `FB ${o.n.fb > 0 ? "+" : ""}${o.n.fb}`); });
}

        ${F.comparacao.map(x => `<tr><td>${x.cenario.split(" — ")[1]}</td><td>${x.estrategia}</td><td>${x.acoes ?? "-"}</td><td>${x.expandidos}</td><td>${x.repetidos}</td></tr>`).join("")}</table></details>
      <div id="f5-fim" style="display:none"><div class="msg ${ok ? "vitoria" : "nao"}">${ok ? "Trilha consistente. Selo 5 conquistado!" : "Trilha não consistente."}</div>
      ${todos ? `<div class="folha" style="background:#2a2414;color:#fff1cf;border:3px solid var(--ambar)"><div class="cofre" id="f5-cofre">🔒</div><h2 style="color:var(--ambar);text-align:center">Cofre de Verificação aberto</h2>${F.epilogo.map(p => `<p>${p}</p>`).join("")}
        <p style="text-align:center"><button class="btn grande" onclick="ir('final')">🎤 Ouvir o discurso da Miss Pearl</button> <button class="btn neutro" onclick="ir('custos')">⚡ Desafio extra</button></p></div>`
        : `<p>Para abrir o Cofre de Verificação, conquiste também o(s) selo(s): ${P.selos.map((s, i) => s ? null : i + 1).filter(Boolean).join(", ")}.</p>`}</div>`;
    const linhas = [...document.querySelectorAll("#f5-rel .chk")]; let k = 0;
    const acende = () => { if (k < linhas.length) { linhas[k].classList.add("on"); linhas[k].scrollIntoView({block: "nearest", behavior: "smooth"}); k++; setTimeout(acende, 330); return; }
      $("#f5-status").textContent = "— concluído"; $("#f5-fim").style.display = ""; document.querySelectorAll("#f5-metodos [data-metodo]").forEach(b => b.disabled = false);
      if (todos) setTimeout(() => { $("#f5-cofre").textContent = "🔓"; }, 700);
      $("#f5-fim").scrollIntoView({block: "start", behavior: "smooth"});
      if (ok) setTimeout(() => carimbo("SELO 5", est, `${proprias ? "A auditoria conferiu as SUAS jogadas nas fases 1 a 4." : "Onde você não jogou, o computador resolveu: três estrelas = jogar as fases 1 a 4 você mesma."}${todos ? " O Cofre de Verificação está aberto!" : ""}`, "f5"), todos ? 1400 : 300); };
    acende();
  }
};

/* ================= FINAL: O DISCURSO DA MISS PEARL =================
   A Miss Pearl fala à população de Verídia: o que aconteceu, como a CIV investigou,
   o que aprendemos e os agradecimentos. Uma cena por vez, como na abertura. */
let discurso = 0;
const DISCURSO = [
  ["🎤 Cidadãs e cidadãos de Verídia", "Boa noite! Aqui é a <b>Miss Pearl</b>, da CIV. Trago a resposta que vocês esperavam: <b>a apuração pode ser conferida do começo ao fim</b>, e cada passo obedece às regras."],
  ["⚠️ O que aconteceu", "Uma falha no sistema de auditoria <b>embaralhou os dados</b> e <b>partiu a trilha</b> entre os locais de votação. Nós não estávamos procurando culpados: precisávamos provar, com regras claras, que dava para refazer o caminho."],
  ["🔍 Como investigamos", "Dividimos o trabalho em 5 problemas. Para cada um, uma ferramenta:", [
    ["🗂️", "Fichas fora de ordem", "arrumamos por zona, seção e horário — como a agenda do celular arruma os nomes."],
    ["📦", "Provas fora de ordem", "usamos uma fila e uma pilha — como a fila da cantina e a pilha de bandejas."],

    ["🔐", "Computador em círculos", "demos a ele uma memória em árvore, que lembra rápido onde já esteve."],
    ["🧾", "Conferência final", "refizemos tudo do zero e conferimos cada passo."]]],
  ["💡 O que aprendemos", "Cinco lições para levar para casa:", [
    ["🧮", "Ordem poupa trabalho", "com milhões de registros, o método certo troca horas por minutos."],
    ["📏", "Computador não adivinha", "ele segue regras — e qualquer pessoa pode conferir essas regras."],
    ["🗺️", "Mais curto ≠ mais barato", "o caminho com menos passos nem sempre gasta menos energia."],
    ["🧠", "Lembrar evita repetir", "anotar o que já viu impede de andar em círculos."],
    ["✅", "Conferir é refazer", "não basta confiar: a prova é refazer o caminho e chegar ao mesmo lugar."]]],
  ["🙏 Obrigada!", "Agradeço à <b>Profa. Dra. Lucy</b>, que orientou esta investigação; aos <b>colegas da turma 2026</b>, que revisaram cada regra; aos <b>estudantes</b> que jogaram e perguntaram; e a <b>você</b>, analista, que resolveu os 5 problemas. <b>Verídia pode confiar no que pode conferir.</b>"]];
function confete() { const c = document.createElement("div"); c.className = "confete";
  c.innerHTML = Array.from({length: 46}, (_, i) => `<i style="left:${(i * 37) % 100}%;animation-delay:${(i % 9) * .25}s;background:${["#d9682b", "#ffb347", "#1f5f5b", "#f4e7c9", "#2e7d4f"][i % 5]}"></i>`).join("");
  document.body.appendChild(c); setTimeout(() => c.remove(), 5200); }
TELAS.final = () => {
  const sel = P.selos.filter(Boolean).length, tot = Object.values(P.estrelas).reduce((a, b) => a + b, 0), extra = P.mc.melhor === D.custos.otimo;
  const desenha = () => { const [tit, fala, itens] = DISCURSO[discurso], ult = discurso === DISCURSO.length - 1;
    $("#disc").innerHTML = `<div class="cena"><div class="ator">${missPearl(150)}<b>Miss Pearl</b><div class="palanque">CIV</div></div>
      <div class="balao-cena"><div class="tit-cena">${tit}</div><div>${fala}</div>
        ${itens ? `<div class="licoes">${itens.map(([ic, t, d]) => `<div><span class="ic">${ic}</span><span><b>${t}:</b> ${d}</span></div>`).join("")}</div>` : ""}</div></div>
      <div class="nav-cena"><button class="btn neutro" id="dc-ant" ${discurso ? "" : "disabled"}>◀</button>
        <span class="pontos">${DISCURSO.map((_, k) => `<i class="${k === discurso ? "on" : ""}"></i>`).join("")}</span>
        ${ult ? "" : `<button class="btn grande" id="dc-prox">Continuar ▶</button>`}</div>`;
    $("#dc-ant").onclick = () => { discurso--; desenha(); };
    if (!ult) $("#dc-prox").onclick = () => { discurso++; desenha(); };
    $("#placar-final").hidden = !ult; if (ult) confete(); };
  $("#tela").innerHTML = `<div class="folha capa"><div class="faixa-festa">🎉 Auditoria concluída 🎉</div>
    <h1>O discurso da Miss Pearl</h1><p class="legenda" style="margin-top:-6px">Praça da Apuração, Verídia · para toda a população</p>
    <div id="disc"></div>
    <div id="placar-final" hidden><div class="resumo-final">
      <div><span class="n">${sel}/5</span>selos</div><div><span class="n">${tot}/18</span>estrelas ⭐</div><div><span class="n">${extra ? "✔" : "—"}</span>desafio extra</div></div>
      <p><button class="btn grande" onclick="discurso=0;ir('menu')">🏠 Voltar ao menu</button>
        ${extra ? "" : `<button class="btn sec grande" onclick="ir('custos')">⚡ Jogar o desafio extra</button>`}
        <button class="btn neutro" onclick="ir('resultados')">📊 Resultados e testes</button>
        <button class="btn neutro" onclick="discurso=0;ir('final')">↺ Ouvir de novo</button></p></div></div>`;
  confete(); desenha();
};

/* ================= SOLVER ================= */
let solv = {prob: "mapa", alg: "BFS"};
TELAS.solver = () => {
  $("#tela").innerHTML = `<div class="folha"><h2>Resolver — o computador joga</h2>
    <p>O solver usa <b>as mesmas regras</b> do jogador. Cada situação do jogo é um vértice; cada ação válida, uma aresta. A <b>BFS</b> explora por camadas (fila); a <b>DFS</b>, em profundidade (pilha). A árvore AVL lembra as situações já vistas.</p>
    <h3>Desafio</h3><div class="escolha" id="sv-p"><button data-k="triagem">Fase 2 — Triagem</button><button data-k="mapa">Fase 3 — Mapa</button></div>
    <h3>Estratégia</h3><div class="escolha" id="sv-a"><button data-k="BFS">BFS (fila)</button><button data-k="DFS (recursiva)">DFS recursiva</button><button data-k="DFS (pilha)">DFS com pilha</button></div>
    <div id="sv-res"></div><div class="barra">${voltar} <button class="btn sec" onclick="ir('custos')">Mapa com custos: BFS × guloso × Dijkstra (aula 11) →</button> <span class="legenda">Código: <span class="codigo">algoritmos/solver.py</span></span></div></div>`;
  ["p", "a"].forEach(t => document.querySelectorAll(`#sv-${t} button`).forEach(b => { b.classList.toggle("sel", b.dataset.k === solv[t === "p" ? "prob" : "alg"]);
    b.onclick = () => { solv[t === "p" ? "prob" : "alg"] = b.dataset.k; TELAS.solver(); }; }));
  const r = D.solver[solv.prob][solv.alg], todos = D.solver[solv.prob];
  $("#sv-res").innerHTML = `<div class="caixa"><b>${r.encontrou ? `Solução com ${r.acoes} ações` : "Sem solução"}</b>
      <ol start="0" class="codigo" style="background:none">${r.caminho.map(([a, e]) => `<li><b>${a}</b> — ${e}</li>`).join("")}</ol></div>
    <table class="metr"><tr><th>estratégia</th><th></th><th>ações</th><th>examinadas</th><th>repetidas barradas (AVL)</th><th>fronteira máx.</th><th>tempo (ms)</th></tr>
      ${Object.entries(todos).map(([n, x]) => `<tr style="${n === solv.alg ? "font-weight:700" : ""}"><td>${n}</td><td></td><td>${x.acoes}</td><td>${x.expandidos}</td><td>${x.repetidos}</td><td>${x.fronteira}</td><td>${x.tempo_ms}</td></tr>`).join("")}</table>
    <p class="legenda">A BFS garante o menor número de ações porque cada ação custa 1. A DFS não tem essa garantia.</p>
    <details><summary>Árvore de busca (cada caixa é uma situação examinada; em laranja, o caminho da solução)</summary><div class="crt" style="overflow-x:auto"><svg id="sv-arv"></svg></div></details>`;
  const a = r.arvore, svg = $("#sv-arv"), DX = solv.prob === "mapa" ? 136 : 250, DY = 70, M = DX / 2 + 10;
  const W = (Math.max(...a.nos.map(n => n.x)) + 1) * DX + M, H = (Math.max(...a.nos.map(n => n.y)) + 1) * DY + 40;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("width", W); const Q = {}; a.nos.forEach(n => Q[n.id] = {x: n.x * DX + M, y: n.y * DY + 28, n});
  a.arestas.forEach(([p, f]) => svgEl("line", {x1: Q[p].x, y1: Q[p].y, x2: Q[f].x, y2: Q[f].y, stroke: Q[p].n.caminho && Q[f].n.caminho ? "#d9682b" : "#6b5236", "stroke-width": 2}, svg));
  a.nos.forEach(n => { const p = Q[n.id]; svgEl("rect", {x: p.x - DX / 2 + 6, y: p.y - 13, width: DX - 12, height: 26, rx: 5, fill: n.caminho ? "#d9682b" : "#2a1d12", stroke: "#ffb347"}, svg);
    svgEl("text", {x: p.x, y: p.y + 5, "text-anchor": "middle", "font-size": 12, style: n.caminho ? "fill:#15110c;font-weight:700" : ""}, svg, n.rotulo); });
};

/* ================= AJUDA e RESULTADOS ================= */
TELAS.ajuda = () => {
  $("#tela").innerHTML = `<div class="folha"><h2>Como jogar</h2>
    <p><b>Tudo é clicável.</b> Em cada fase há uma faixa laranja <b>“O que fazer agora”</b> e um botão <b>💡 Dica</b>. Jogadas erradas são recusadas com explicação e não estragam nada. <b>Desfazer</b> volta um passo.</p>

    <p><b>Estrelas:</b> cada fase dá de 1 a 3. Três estrelas = jogar como o computador: o mínimo de ações que a BFS acha (Fases 2 e 3), a menor energia que o Dijkstra acha (desafio extra), a chave certa de primeira (Fase 1), bons palpites (Fase 4) e todas as fases jogadas por você (Fase 5). Em cada fase, o botão ❔ Como jogar repete as instruções.</p>
    <table class="metr"><tr><th>Fase</th><th>Como vencer</th></tr>

    <p class="legenda" style="margin-top:12px">Como esta página funciona: o Python executou as regras reais do jogo e calculou todas as situações possíveis de cada fase, o resultado de cada jogada e a dica do solver (BFS) para cada situação. A página só consulta essas tabelas: as regras estão no código em <span class="codigo">jogo/</span>, não aqui. O progresso fica guardado neste navegador.</p>

};

  test_jogo_web: "esta página concorda, jogada a jogada, com o Python",
  test_mapa_custos: "heap, Dijkstra (aula 11), guloso, mapa com custos",

    <div class="caixa"><h3>Fase 4 — cofre</h3>${P.f4.k}/${D.fase4.lacres.length} lacres, ${P.f4.acertos} palpites certos; ${Object.values(P.f4.pares).filter(x => x === true).length}/${D.fase4.pares.length} pares certos</div>
    <div class="caixa"><h3>Fase 5 — auditoria</h3>${P.f5.feito ? (P.selos[4] ? "consistente" : "não consistente") : "não executada"}</div>
    <div class="caixa"><h3>Desafio extra — mapa com custos</h3>${P.mc.melhor === null ? "ainda não chegou a F" : `menor energia gasta: ${P.mc.melhor} (o Dijkstra gasta ${D.custos.otimo})`}</div>
    <h2 style="margin-top:22px">🧪 Testes automáticos</h2>
    ${D.testes ? `<p style="font-size:19px"><b>${D.testes.total} testes · ${D.testes.falhas === 0 ? "✅ todos aprovados" : `❌ ${D.testes.falhas} falha(s)`}</b> <span class="legenda">(resultado da execução quando esta página foi gerada)</span></p>
      <table class="metr"><tr><th>arquivo de testes</th><th>o que confere</th><th>testes</th></tr>${D.testes.por_arquivo.map(([m, n]) => `<tr><td class="codigo">testes/${m}.py</td><td>${DESCR_TESTES[m] || ""}</td><td>${n}</td></tr>`).join("")}</table>`
      : "<p>Rode <span class='codigo'>rodar_testes.bat</span> (ou <span class='codigo'>python -m unittest discover -s testes -t .</span>) para ver o resultado.</p>"}
    <p class="legenda">Para conferir de novo: <span class="codigo">rodar_testes.bat</span> no Windows, ou <span class="codigo">python -m unittest discover -s testes -t .</span></p>
    <h2 style="margin-top:22px">🤖 Declaração de uso de inteligência artificial</h2>
    <div class="caixa" style="border-style:solid;font-size:16px">

      <p>As decisões sobre requisitos, regras do jogo, linguagem e escolhas de projeto — e sobre o que manter, alterar ou descartar — foram da autora, que revisou, testou e validou o resultado e assume a responsabilidade pelo conteúdo.</p>
      <p style="margin:0">O registro de cada interação (objetivo, trecho aproveitado, alterações e forma de validação) acompanha a entrega à professora, conforme a seção 14.4 do enunciado.</p></div>
    ${voltar}</div>`;
};

desenharSelos(); marcarSom(); ir("menu");
</script>
