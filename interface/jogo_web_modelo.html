<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Urna Lógica — Jogo</title>
<style>
  :root {
    --parede: #2e1d11; --painel: #3a2516; --papel: #f6ead0; --papel2: #fbf3df; --tinta: #2b1d12; --tinta2: #6b5236;
    --laranja: #d9682b; --laranja2: #a9481a; --petroleo: #1f5f5b; --petroleo2: #164844; --ambar: #ffb347;
    --crt: #15110c; --verde: #2e7d4f; --vermelho: #b5321e; --borda: #cdb98f;
    --titulo: "Futura", "Century Gothic", "Avenir Next", "Trebuchet MS", sans-serif;
    --maquina: "Consolas", "Courier New", monospace;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: var(--parede); color: var(--tinta); font: 17px/1.5 "Segoe UI", system-ui, sans-serif; }
  header.topo { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center;
                background: #1d120a; color: var(--papel); padding: 10px 18px; border-bottom: 4px solid var(--laranja); }
  header.topo .marca { font-family: var(--titulo); letter-spacing: .1em; text-transform: uppercase; font-size: 14px; font-weight: 700; }
  .selos { display: flex; gap: 8px; margin-left: auto; }
  .selo { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font-family: var(--titulo); font-weight: 700;
          background: #4a3a2a; color: #9c8a73; border: 2px solid #6b5236; font-size: 15px; }
  .selo.ok { background: radial-gradient(circle at 35% 35%, #f19a5c, var(--laranja2)); color: #fff6e4; border-color: var(--ambar); box-shadow: 0 0 10px rgba(255,179,71,.5); }
  main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
  .folha { background: var(--papel); border-radius: 8px; padding: 22px 26px; box-shadow: 0 8px 0 #1d120a; margin-bottom: 18px; }
  h1, h2, h3 { font-family: var(--titulo); margin: 0 0 10px; }
  h1 { font-size: 28px; } h2 { font-size: 22px; } h3 { font-size: 15px; text-transform: uppercase; letter-spacing: .06em; color: var(--tinta2); }
  p { margin: 0 0 10px; }
  .agora { background: #fff3d6; border: 3px solid var(--laranja); border-radius: 10px; padding: 12px 16px; margin: 12px 0; font-size: 18px; }
  .agora b { font-family: var(--titulo); letter-spacing: .06em; color: var(--laranja2); display: block; font-size: 13px; text-transform: uppercase; }
  .msg { border-radius: 8px; padding: 12px 16px; margin: 12px 0; font-size: 17px; white-space: pre-line; border: 2px solid var(--tinta2); background: var(--papel2); min-height: 50px; }
  .msg.ok { border-color: var(--verde); background: #e3f1e5; } .msg.nao { border-color: var(--vermelho); background: #f8e1da; }
  .msg:empty { display: none; }
  .msg.dica { border-color: var(--petroleo); background: #e0eeec; }
  .msg.vitoria { border-color: var(--ambar); background: #fff1cf; font-size: 20px; font-weight: 600; }
  button { font: inherit; cursor: pointer; }
  .btn { font-family: var(--titulo); font-size: 17px; font-weight: 700; letter-spacing: .03em;
         background: var(--laranja); color: #fff8ec; border: 0; border-bottom: 5px solid var(--laranja2);
         border-radius: 10px; padding: 12px 18px; margin: 4px 6px 4px 0; min-height: 50px; }
  .btn:hover { filter: brightness(1.07); } .btn:active { transform: translateY(2px); border-bottom-width: 3px; }
  .btn.sec { background: var(--petroleo); border-bottom-color: var(--petroleo2); }
  .btn.neutro { background: #e6d6b2; color: var(--tinta); border-bottom-color: #b9a37a; }
  .btn.grande { font-size: 20px; padding: 16px 22px; min-width: 220px; }
  .btn:disabled { opacity: .4; cursor: default; }
  .grade { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; }
  .cartao { background: var(--papel2); border: 2px solid var(--borda); border-radius: 10px; padding: 14px; }
  .cartao .btn { width: 100%; margin-top: 8px; }
  .dois { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 16px; }
  @media (max-width: 820px) { .dois { grid-template-columns: 1fr; } .folha { padding: 18px 16px; } }
  .caixa { background: var(--papel2); border: 2px dashed var(--borda); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
  .ficha { display: inline-block; font-family: var(--maquina); background: #fff; border: 2px solid var(--tinta2); border-radius: 6px;
           padding: 6px 12px; margin: 3px; font-size: 17px; font-weight: 700; }
  .ficha.destaque { background: var(--ambar); border-color: var(--laranja2); }
  .vazia { color: var(--tinta2); font-style: italic; }
  table.reg { border-collapse: collapse; width: 100%; font-family: var(--maquina); font-size: 15px; }
  table.reg th { text-align: left; font-family: var(--titulo); font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--tinta2);
                 border-bottom: 2px solid var(--tinta2); padding: 6px; }
  table.reg td { padding: 5px 6px; border-bottom: 1px dotted var(--borda); }
  table.reg tr.erro td { background: #f6c5b8; }
  .escolha { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 12px; }
  .escolha button { font-family: var(--titulo); font-weight: 700; font-size: 16px; border-radius: 8px; padding: 10px 14px;
                    border: 2px solid var(--tinta2); background: #fff8ec; color: var(--tinta); }
  .escolha button.sel { background: var(--petroleo); color: #fff; border-color: var(--petroleo2); }
  .crt { background: var(--crt); border: 8px solid #5b4632; border-radius: 12px; padding: 8px; }
  .crt svg text { fill: var(--ambar); font-family: var(--maquina); }
  .legenda { font-size: 14px; color: var(--tinta2); }
  details { margin: 10px 0; } summary { cursor: pointer; font-family: var(--titulo); font-weight: 700; color: var(--petroleo); }
  .doc { font-family: var(--maquina); background: var(--papel2); border-left: 5px solid var(--laranja); padding: 10px 14px; white-space: pre-line; font-size: 15px; }
  .barra { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; margin-top: 10px; padding-top: 10px; border-top: 2px dotted var(--borda); }
  .codigo { font-family: var(--maquina); font-size: 14px; background: #efe3c4; border-radius: 4px; padding: 1px 6px; }
  table.metr { border-collapse: collapse; width: 100%; font-size: 15px; }
  table.metr th, table.metr td { border-bottom: 1px dotted var(--borda); padding: 6px; text-align: right; }
  table.metr th:first-child, table.metr td:first-child, table.metr th:nth-child(2), table.metr td:nth-child(2) { text-align: left; }
</style>
</head>
<body>
<header class="topo">
  <span class="marca">Urna Lógica · Verídia 2042</span>
  <button class="btn neutro" style="min-height:36px;padding:6px 12px;font-size:14px" onclick="ir('menu')">Menu</button>
  <div class="selos" id="selos" title="Selos conquistados"></div>
</header>
<main id="tela"></main>

<script>
const D = /*__DADOS__*/null;
const $ = s => document.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
function svgEl(tag, at, pai, txt) { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); if (txt !== undefined) e.textContent = txt; if (pai) pai.appendChild(e); return e; }
const fichas = (l, d0) => l.length ? l.map((x, i) => `<span class="ficha${d0 && i === 0 ? " destaque" : ""}">${x}</span>`).join("") : '<span class="vazia">(vazia)</span>';

/* ================= progresso (fica salvo no navegador, se possível) ================= */
const NOVO = () => ({ selos: [false, false, false, false, false],
  f1: { tentativas: [] }, f2: { atual: 0, hist: [], acoes: [] }, f3: { atual: 0, hist: [], trilha: ["A"] },
  f4: { k: 0, acertos: 0, palpites: [], pares: {} }, f5: { feito: false, alg: null } });
let P = NOVO();
try { const s = localStorage.getItem("urna-logica"); if (s) P = Object.assign(NOVO(), JSON.parse(s)); } catch (e) {}
function salvar() { try { localStorage.setItem("urna-logica", JSON.stringify(P)); } catch (e) {} desenharSelos(); }
function desenharSelos() { $("#selos").innerHTML = P.selos.map((s, i) => `<span class="selo${s ? " ok" : ""}" title="Selo ${i + 1}">${s ? "✔" : i + 1}</span>`).join(""); }

function ir(tela) { TELAS[tela](); window.scrollTo(0, 0); desenharSelos(); }
const voltar = '<button class="btn neutro" onclick="ir(\'menu\')">← Voltar ao menu</button>';
function cabecalho(n) {
  const c = D.capitulos[n - 1], fase = D["fase" + n];
  return `<h2>${fase.nome} ${P.selos[n - 1] ? "· ✔ selo obtido" : ""}</h2>
    <details><summary>O que aconteceu (história)</summary><div class="doc">${fase.abertura}</div></details>
    <p><b>Sua missão:</b> ${c.missao}</p>`;
}

/* ================= MENU ================= */
const TELAS = {};
TELAS.menu = () => {
  const n = P.selos.filter(Boolean).length;
  $("#tela").innerHTML = `<div class="folha">
    <h1>${D.titulo}</h1>
    ${n === 0 ? `<details open><summary>A história</summary>${D.prologo.map(p => `<p>${p}</p>`).join("")}<p class="legenda">${D.aviso}</p></details>` : ""}
    <div class="agora"><b>O que fazer agora</b>${n === 5 ? "Os 5 selos foram reunidos. O Cofre de Verificação está aberto!" :
      `Escolha uma fase e ganhe o selo. Você tem ${n} de 5. Comece pela fase ${P.selos.findIndex(s => !s) + 1}.`}</div>
    <div class="grade">${D.capitulos.map(c => `<div class="cartao"><h3>Fase ${c.selo} ${P.selos[c.selo - 1] ? "✔" : ""}</h3>
      <b>${D["fase" + c.selo].nome.replace(/Fase \d — /, "")}</b><p class="legenda">${c.missao}</p>
      <button class="btn${P.selos[c.selo - 1] ? " sec" : ""}" onclick="ir('f${c.selo}')">${P.selos[c.selo - 1] ? "Jogar de novo" : "Jogar"}</button></div>`).join("")}</div>
    <div class="barra">
      <button class="btn sec grande" onclick="ir('solver')">Resolver (o computador joga)</button>
      <button class="btn neutro grande" onclick="ir('ajuda')">Como jogar</button>
      <button class="btn neutro grande" onclick="ir('resultados')">Resultados</button>
      <button class="btn neutro" onclick="if(confirmarZerar())ir('menu')">Zerar progresso</button>
    </div></div>`;
};
let zerarPedido = false;
function confirmarZerar() { if (!zerarPedido) { zerarPedido = true; alertaSuave("Clique de novo em “Zerar progresso” para confirmar."); return false; }
  zerarPedido = false; P = NOVO(); salvar(); return true; }
function alertaSuave(t) { const d = document.createElement("div"); d.className = "msg dica"; d.textContent = t; $("#tela .folha").appendChild(d); }

/* ================= FASE 1 ================= */
let f1sel = { alg: null, crit: null };
TELAS.f1 = () => {
  const F = D.fase1;
  $("#tela").innerHTML = `<div class="folha">${cabecalho(1)}
    <div class="agora" id="f1-agora"></div>
    <div class="caixa"><h3>Enigma</h3>${F.enigma.replace(/\n/g, " ")}</div>
    <h3>1. Escolha o método de ordenação</h3><div class="escolha" id="f1-alg">${F.algoritmos.map(([k, n]) => `<button data-k="${k}">${n}</button>`).join("")}</div>
    <h3>2. Escolha o critério</h3><div class="escolha" id="f1-crit">${F.criterios.map(([k, n]) => `<button data-k="${k}">${n}</button>`).join("")}</div>
    <button class="btn grande" id="f1-ord">Ordenar o lote</button> <button class="btn sec" id="f1-dica">💡 Dica</button>
    <div class="msg" id="f1-msg">Escolha um método e um critério e clique em Ordenar.</div>
    <h3>Lote de registros</h3><div id="f1-tab"></div>
    <details><summary>Comparar o trabalho dos três métodos (10, 100 e 500 registros)</summary><table class="metr"><tr><th>registros</th><th>método</th><th>comparações</th><th>movimentações</th></tr>
      ${F.comparacao.map(l => `<tr><td>${l[0]}</td><td>${l[1]}</td><td>${l[2].toLocaleString("pt-BR")}</td><td>${l[3].toLocaleString("pt-BR")}</td></tr>`).join("")}</table>
      <p class="legenda">O Bubble cresce com n² (n(n−1)/2 comparações); Merge e Quick, com n log n.</p></details>
    <div class="barra">${voltar} <span class="legenda">Código: <span class="codigo">algoritmos/ordenacao.py</span> · <span class="codigo">jogo/fase1.py</span></span></div></div>`;
  const tabela = (regs, erro) => `<table class="reg"><tr><th>#</th><th>id</th><th>zona</th><th>seção</th><th>opção</th><th>horário</th><th>situação</th></tr>
    ${regs.map((r, i) => `<tr class="${erro >= 0 && (i === erro || i === erro + 1) ? "erro" : ""}"><td>${i}</td>${r.map(c => `<td>${c}</td>`).join("")}</tr>`).join("")}</table>`;
  $("#f1-tab").innerHTML = tabela(F.registros, -1);
  const agora = () => $("#f1-agora").innerHTML = "<b>O que fazer agora</b>" + (P.selos[0] ? "Lote aceito! Volte ao menu e vá para a Fase 2." :
    !f1sel.alg ? "Escolha um método de ordenação (qualquer um serve)." : !f1sel.crit ? "Agora escolha o critério que segue a regra do enigma." : "Clique em “Ordenar o lote”.");
  ["alg", "crit"].forEach(t => document.querySelectorAll(`#f1-${t} button`).forEach(b => {
    if (f1sel[t] === b.dataset.k) b.classList.add("sel");
    b.onclick = () => { f1sel[t] = b.dataset.k; document.querySelectorAll(`#f1-${t} button`).forEach(x => x.classList.toggle("sel", x === b)); agora(); }; }));
  $("#f1-ord").onclick = () => {
    const m = $("#f1-msg");
    if (!f1sel.alg || !f1sel.crit) { m.className = "msg nao"; m.textContent = "Escolha primeiro o método e o critério."; return; }
    const r = F.resultados[f1sel.alg + "|" + f1sel.crit];
    P.f1.tentativas.push([r.algoritmo, f1sel.crit, r.comparacoes, r.aceito]);
    if (r.aceito) P.selos[0] = true; salvar();
    $("#f1-tab").innerHTML = tabela(r.registros, r.erro);
    m.className = "msg " + (r.aceito ? "vitoria" : "nao");
    m.textContent = `${r.algoritmo}: ${r.comparacoes} comparações, ${r.movimentacoes} movimentações.\n${r.mensagem}`;
    agora();
  };
  $("#f1-dica").onclick = () => { const m = $("#f1-msg"); m.className = "msg dica";
    m.textContent = "Qualquer método serve: o que decide é o CRITÉRIO. A regra pede zona primeiro, depois seção, depois horário — escolha o último critério da lista."; };
  agora();
};

/* ================= FASE 2 ================= */
TELAS.f2 = () => {
  const F = D.fase2;
  $("#tela").innerHTML = `<div class="folha">${cabecalho(2)}
    <div class="agora" id="f2-agora"></div>
    <div class="dois"><div>
      <div class="caixa"><h3>Fila de entrada (só a 1ª sai)</h3><div id="f2-fila"></div></div>
      <div class="caixa"><h3>Pilha de espera (só o topo sai)</h3><div id="f2-pilha"></div></div>
      <div class="caixa"><h3>Arquivo</h3><div id="f2-arq"></div></div>
    </div><div>
      <div class="caixa"><h3>Custódia — objetivo: ${F.alvo.join(" → ")}</h3><div id="f2-cus"></div></div>
      <div><button class="btn" data-a="aceitar">Aceitar<br><small>1ª da fila → custódia</small></button>
        <button class="btn" data-a="guardar">Guardar<br><small>1ª da fila → pilha</small></button>
        <button class="btn" data-a="arquivar">Arquivar<br><small>1ª da fila → arquivo</small></button>
        <button class="btn" data-a="liberar">Liberar<br><small>topo da pilha → custódia</small></button></div>
      <div><button class="btn sec" id="f2-dica">💡 Dica</button><button class="btn neutro" id="f2-desf">↶ Desfazer</button><button class="btn neutro" id="f2-rein">Recomeçar</button></div>
    </div></div>
    <div class="msg" id="f2-msg">Faça a primeira jogada.</div>
    <details><summary>Regras completas</summary><ul>
      <li><b>Aceitar:</b> a 1ª da fila entra na custódia, se for a próxima esperada.</li>
      <li><b>Guardar:</b> a 1ª da fila vai para o topo da pilha, se fizer parte da custódia e precisar sair antes de quem está no topo.</li>
      <li><b>Arquivar:</b> a 1ª da fila vai para o arquivo, se NÃO fizer parte da custódia.</li>
      <li><b>Liberar:</b> o topo da pilha entra na custódia, se for a próxima esperada.</li>
      <li><b>Desfazer:</b> volta à situação anterior (pilha do histórico).</li></ul>
      ${Object.entries(F.evidencias).map(([k, v]) => `<span class="ficha">${k}</span> ${v}`).join("<br>")}</details>
    <div class="barra">${voltar} <span class="legenda">Código: <span class="codigo">jogo/fase2.py</span> · <span class="codigo">estruturas/fila.py, pilha.py, lista_ligada.py</span></span></div></div>`;
  const S = P.f2;
  const desenha = () => { const e = F.estados[S.atual];
    $("#f2-fila").innerHTML = fichas(e.fila, true);
    $("#f2-pilha").innerHTML = e.pilha.length ? e.pilha.map((x, i) => `<div><span class="ficha${i ? "" : " destaque"}" style="min-width:90px">${x}${i ? "" : " ← topo"}</span></div>`).join("") : '<span class="vazia">(vazia)</span>';
    $("#f2-arq").innerHTML = fichas(e.arquivo);
    $("#f2-cus").innerHTML = e.custodia.length ? e.custodia.map(x => `<span class="ficha">${x}</span>`).join(" → ") : '<span class="vazia">(vazia)</span>';
    $("#f2-agora").innerHTML = "<b>O que fazer agora</b>" + (e.venceu ? "Custódia completa! Volte ao menu e vá para a Fase 3." :
      `A custódia espera <b style="display:inline">${e.esperado}</b>. A 1ª da fila é ${e.fila[0] || "—"}${e.pilha.length ? `; o topo da pilha é ${e.pilha[0]}` : ""}. Escolha a ação que leva cada evidência ao lugar certo.`);
  };
  document.querySelectorAll("[data-a]").forEach(b => b.onclick = () => {
    const r = F.estados[S.atual].acoes[b.dataset.a], m = $("#f2-msg");
    if (r.ok) { S.hist.push(S.atual); S.atual = r.destino; S.acoes.push(b.dataset.a); }
    const venceu = F.estados[S.atual].venceu; if (venceu) P.selos[1] = true; salvar();
    m.className = "msg " + (venceu ? "vitoria" : r.ok ? "ok" : "nao"); m.textContent = r.msg; desenha(); });
  $("#f2-dica").onclick = () => { const m = $("#f2-msg"); m.className = "msg dica"; m.textContent = F.estados[S.atual].dica; };
  $("#f2-desf").onclick = () => { const m = $("#f2-msg");
    if (S.hist.length) { S.atual = S.hist.pop(); const a = S.acoes.pop(); m.className = "msg"; m.textContent = `Desfeito: ${a}. (A ação mais recente sai primeiro — como numa pilha.)`; }
    else { m.className = "msg nao"; m.textContent = "Não há ação para desfazer."; } salvar(); desenha(); };
  $("#f2-rein").onclick = () => { S.atual = 0; S.hist = []; S.acoes = []; salvar(); $("#f2-msg").className = "msg"; $("#f2-msg").textContent = "Fase recomeçada."; desenha(); };
  desenha();
};

/* ================= FASE 3 ================= */
function desenhaMapa(svg, opt) {
  const F = D.fase3, POS = {}; F.vertices.forEach(v => POS[v.id] = v);
  svg.innerHTML = ""; svg.setAttribute("viewBox", "-30 70 790 480"); svg.setAttribute("width", "100%");
  const cam = new Set(), ar = new Set(); (opt.caminho || []).forEach((v, k, a) => { cam.add(v); if (k) ar.add([a[k - 1], v].sort().join()); });
  F.arestas.forEach(([u, v]) => svgEl("line", {x1: POS[u].x, y1: POS[u].y, x2: POS[v].x, y2: POS[v].y, stroke: ar.has([u, v].sort().join()) ? "#ffb347" : "#6b5236", "stroke-width": ar.has([u, v].sort().join()) ? 7 : 4}, svg));
  const viz = new Set(opt.vizinhos || []);
  F.vertices.forEach(v => { const g = svgEl("g", {style: opt.clique ? "cursor:pointer" : ""}, svg);
    let f = "#2a1d12"; if (cam.has(v.id)) f = "#a9481a"; if (viz.has(v.id)) f = "#1f5f5b"; if (v.id === opt.atual) f = "#ffb347";
    svgEl("circle", {cx: v.x, cy: v.y, r: 30, fill: f, stroke: viz.has(v.id) ? "#fff6e4" : "#ffb347", "stroke-width": viz.has(v.id) ? 4 : 2, "stroke-dasharray": viz.has(v.id) ? "6 4" : ""}, g);
    svgEl("text", {x: v.x, y: v.y + 9, "text-anchor": "middle", "font-size": 26, "font-weight": 700, style: v.id === opt.atual ? "fill:#15110c" : ""}, g, v.id);
    svgEl("text", {x: v.x, y: v.y + (v.id === "G" ? -40 : 50), "text-anchor": "middle", "font-size": 15}, g, v.nome);
    if (v.pista || v.porta) svgEl("text", {x: v.x, y: v.y + 69, "text-anchor": "middle", "font-size": 15, style: "fill:#ff8a3d"}, g, v.pista ? "🔑 pista " + v.pista : "🔒 exige " + v.porta);
    if (opt.clique) g.onclick = () => opt.clique(v.id); });
}
TELAS.f3 = () => {

function desenhaAVL(svg, raiz, destaque) {
  svg.innerHTML = ""; if (!raiz) { svg.setAttribute("viewBox", "0 0 300 50"); svg.setAttribute("width", 300); svgEl("text", {x: 10, y: 32}, svg, "(cofre vazio)"); return; }
  const nos = []; let x = 0; (function io(n, d) { if (!n) return; io(n.e, d + 1); nos.push({n, x: x++, d}); io(n.d, d + 1); })(raiz, 0);
  const DX = 64, DY = 70, W = nos.length * DX + 40, H = (Math.max(...nos.map(o => o.d)) + 1) * DY + 30;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`); svg.setAttribute("width", W); svg.style.maxWidth = "100%";
  const P2 = new Map(); nos.forEach(o => P2.set(o.n, {x: o.x * DX + 40, y: o.d * DY + 32}));
  nos.forEach(o => ["e", "d"].forEach(l => { if (o.n[l]) { const a = P2.get(o.n), b = P2.get(o.n[l]); svgEl("line", {x1: a.x, y1: a.y, x2: b.x, y2: b.y, stroke: "#6b5236", "stroke-width": 3}, svg); } }));
  nos.forEach(o => { const p = P2.get(o.n);
    svgEl("circle", {cx: p.x, cy: p.y, r: 21, fill: o.n.k === destaque ? "#ffb347" : "#2a1d12", stroke: "#ffb347", "stroke-width": 2}, svg);
    svgEl("text", {x: p.x, y: p.y + 6, "text-anchor": "middle", "font-weight": 700, "font-size": 17, style: o.n.k === destaque ? "fill:#15110c" : ""}, svg, o.n.k);
    svgEl("text", {x: p.x, y: p.y + 36, "text-anchor": "middle", "font-size": 12}, svg, `FB ${o.n.fb > 0 ? "+" : ""}${o.n.fb}`); });
}
